<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 여기는 우리 페이지만 그린다. 그래도 문을 닫아 둔다 —
     혹시 남의 글이 스며들어 코드가 되더라도, 밖으로 «내보낼» 길이 없어야 한다.
     default-src 'none' 이 fetch·XHR·WebSocket 을 통째로 막는다.
     그림은 우리 파일과 data: 만 (화면 사진·아이콘), 미디어도 우리 파일만
     (등장 연출로 넣은 동영상은 file: 로 읽는다). -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none';
               script-src file: 'unsafe-inline';
               style-src file: 'unsafe-inline';
               font-src file:;
               img-src file: data:;
               media-src file: data:">
<link rel="stylesheet" href="../assets/font/pretendard.css">
<link rel="stylesheet" href="tokens.css">
<script src="theme.js"></script>
<script src="icons.js"></script>
<style>
  :root {
    --accent: #5ecfb6;
    --scrim-a: 0.92;   /* 주소에 값이 없을 때만 — 메인 SCRIM.fallback 과 같게 */
    --scrim: rgba(20, 20, 25, var(--scrim-a));
    --label: rgba(255, 255, 255, 0.96);
    --secondary: rgba(235, 235, 245, 0.60);
    --tertiary: rgba(235, 235, 245, 0.32);
    --separator: rgba(255, 255, 255, 0.09);
    --fill: rgba(255, 255, 255, 0.07);
    --hair: rgba(255, 255, 255, 0.14);
    --grass-empty: rgba(255, 255, 255, 0.07);
    --veil: rgba(24, 24, 28, 0.94);
    --inset: 12px;
    --r: 20px;
  }
  /* 라이트 글자·강조색은 tokens.css 가 정한다. 여기서 같은 이름을 다시 쓰면 그 값을 덮으므로 이 창에만 있는 것만 둔다.
     테두리는 예전 흰색 .60 이 흰 유리 위에서 안 보여 공용 hairline 을 쓴다. */
  :root[data-theme="light"] {
    --hair: var(--hairline);
    --grass-empty: rgba(0, 0, 0, 0.07);
    --veil: rgba(242, 242, 247, 0.94);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI Variable Display', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--label);
    display: flex;
    padding: var(--inset);
  }
  .panel {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    background: var(--scrim); border-radius: var(--r); overflow: hidden; position: relative;
    box-shadow: inset 0 0 0 0.5px var(--hair), 0 6px 18px rgba(0,0,0,0.44), 0 1px 4px rgba(0,0,0,0.28);
  }
  body.no-glass .panel { background: var(--veil); backdrop-filter: blur(30px) saturate(1.8); }
  .panel::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; pointer-events: none;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.20) 22%, rgba(255,255,255,0.20) 78%, transparent);
  }

  .nav {
    -webkit-app-region: drag;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 14px 16px 10px; flex: none;
  }
  .nav h1 { grid-column: 2; font-size: 16.5px; font-weight: 650; letter-spacing: -0.02em; }
  .nav .close {
    all: unset; -webkit-app-region: no-drag; grid-column: 3; justify-self: end;
    cursor: default; display: grid; place-items: center; width: 24px; height: 24px;
    border-radius: 50%; color: var(--secondary); transition: background 0.12s, color 0.12s;
  }
  .nav .close svg { width: 13px; height: 13px; }
  .nav .close:hover { background: var(--fill); color: var(--label); }

  /* 탭 */
  .tabs {
    -webkit-app-region: no-drag; flex: none;
    display: flex; gap: 4px; padding: 4px 16px 4px; overflow-x: auto;
    /* 잘린 탭이 더 있음을 알리는 양끝 페이드 */
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
    cursor: grab;
  }
  .tabs.dragging { cursor: grabbing; }
  .tabs.dragging .tab { pointer-events: none; }   /* 끄는 중엔 탭이 눌리지 않게 */
  /* 스크롤바를 숨기면 스크롤이 된다는 걸 알 수가 없다 — 가늘게 남긴다 */
  .tabs::-webkit-scrollbar { height: 3px; }
  .tabs::-webkit-scrollbar-track { background: transparent; }
  .tabs::-webkit-scrollbar-thumb {
    background: transparent; border-radius: 2px; transition: background 0.15s;
  }
  .tabs:hover::-webkit-scrollbar-thumb { background: var(--tertiary); }
  .tab {
    all: unset; cursor: default; flex: none;
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 600; letter-spacing: -0.01em;
    padding: 6px 11px; border-radius: 999px; color: var(--secondary);
    background: var(--fill); box-shadow: inset 0 0 0 0.5px var(--separator);
    white-space: nowrap;
  }
  .tab svg { width: 13px; height: 13px; }
  .tab .emoji { font-size: 12px; line-height: 1; display: inline-grid; place-items: center; }
  /* 종류 색은 JS 가 --c 로만 넘긴다 — 인라인 background·color 는 테마 규칙을 전부 이겨서
     라이트에서도 파스텔이 그대로 남았다. 라이트는 색상·채도는 두고 명도만 낮춘다 (글리프 .44, 채움 .50). */
  .tab { --mark: var(--c); }
  .tab.on { background: var(--c, var(--accent)); color: #08110f; box-shadow: none; }
  :root[data-theme="light"] .tab { --mark: oklch(from var(--c, var(--accent)) 0.44 c h); }
  :root[data-theme="light"] .tab.on { background: oklch(from var(--c, var(--accent)) 0.50 c h); color: #fff; }

  .body { flex: 1; overflow-y: auto; padding: 8px 16px 18px; }
  .body::-webkit-scrollbar { width: 8px; }
  .body::-webkit-scrollbar-thumb {
    background: transparent; border-radius: 4px; transition: background 0.15s;
  }
  .body:hover::-webkit-scrollbar-thumb { background: var(--fill); }

  /* 종류 상세 헤더 (특정 종류 선택 시) */
  .detail { display: none; margin-top: 6px; }
  body.type-view .detail { display: block; }
  /* 종류를 고르면 그 색이 강조색이 된다. JS 는 원래 색을 --type 으로만 넘기고 테마별 색은 여기서 만든다.
     --accent-fill 은 :root 에서 이미 계산이 끝나 --accent 만 바꾸면 안 따라오므로 둘을 같이 둔다. */
  body.type-view { --accent: var(--type); --accent-fill: var(--type); }
  :root[data-theme="light"] body.type-view {
    --accent: oklch(from var(--type) 0.44 c h);
    --accent-fill: oklch(from var(--type) 0.50 c h);
  }
  .d-next { font-size: 40px; font-weight: 250; letter-spacing: -0.045em; line-height: 1; font-variant-numeric: tabular-nums; }
  .d-when { font-size: 12.5px; color: var(--secondary); margin-top: 7px; }
  .d-when b { color: color-mix(in srgb, var(--accent) 82%, white); font-weight: 600; }
  :root[data-theme="light"] .d-when b { color: var(--accent); }
  /* 버튼은 폭을 꽉 채우지 않고 내용만큼 (배너처럼 안 보이게) */
  .d-act { display: flex; gap: 8px; margin-top: 16px; }
  .btn {
    all: unset; cursor: default; text-align: center;
    padding: 8px 16px; border-radius: 10px; font-size: 12.5px; font-weight: 620;
  }
  .btn svg { width: 13px; height: 13px; vertical-align: -2px; margin-right: 4px; }
  .btn.primary { background: color-mix(in srgb, var(--accent) 88%, black); color: #08110f; }
  /* 라이트는 강조색을 검정에 섞으면 흰 글자가 모자란다 — 흰 글자용 채움(--accent-fill)을 쓴다 */
  :root[data-theme="light"] .btn.primary { background: var(--accent-fill); color: #fff; }
  .btn.ghost { background: var(--fill); box-shadow: inset 0 0 0 0.5px var(--separator); color: var(--secondary); }

  /* 전체 요약 (전체 선택 시) */
  .summary { display: none; }
  body.all-view .summary { display: block; }

  .streak-row { display: flex; align-items: baseline; justify-content: space-between; margin-top: 10px; }
  .streak-row .big { font-size: 30px; font-weight: 250; letter-spacing: -0.04em; line-height: 1; }
  .streak-row .big b { color: var(--accent); font-weight: 300; }
  .streak-row .cap { font-size: 12px; color: var(--secondary); }
  .streak-row .cap b { color: var(--label); font-weight: 600; }

  /* 잔디 */
  .grass-wrap { overflow-x: auto; margin-top: 18px; padding-bottom: 3px; }
  .grass-wrap::-webkit-scrollbar { height: 6px; }
  .grass-wrap::-webkit-scrollbar-thumb {
    background: transparent; border-radius: 3px; transition: background 0.15s;
  }
  .grass-wrap:hover::-webkit-scrollbar-thumb { background: var(--fill); }
  .grass { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 15px); gap: 3px; width: max-content; }
  .grass .cell { width: 15px; height: 15px; border-radius: 3px; background: var(--grass-empty); }
  .grass .cell.future { background: transparent; }

  .legend { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--tertiary); margin-top: 11px; }
  .legend .cell { width: 10px; height: 10px; border-radius: 2px; background: var(--grass-empty); }
  /* 라이트는 옅은 단계(.28·.50) 칸이 흰 유리 위에서 거의 안 보인다 (1.5·2.2:1).
     채운 칸에만 같은 강조색 64% 테두리를 안쪽으로 둘러 칸 자체는 3:1 을 넘기고 (가장 나쁜 1단계도 3.37),
     단계 차이는 안쪽 알파 차이가 그대로 보여 준다. 빈 칸은 1단계보다 옅게 그대로 둔다. 범례 칸도 같은 규칙을 탄다.
     두께는 1.5px — 1px 은 125% 배율에서 칸 모서리가 반 픽셀에 걸려 번지면서 2.6:1 로 떨어졌다. */
  :root[data-theme="light"] .grass .cell[data-lv],
  :root[data-theme="light"] .legend .cell[data-lv] { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 64%, transparent); }

  .range { display: flex; align-items: center; gap: 12px; margin-top: 20px; }
  .range .rlab { font-size: 12px; color: var(--secondary); }
  .segs { display: inline-flex; background: var(--fill); border-radius: 9px; padding: 2px; box-shadow: inset 0 0 0 0.5px var(--separator); }
  .segs button { all: unset; cursor: default; font-family: inherit; font-size: 11.5px; font-weight: 600; color: var(--secondary); padding: 5px 12px; border-radius: 7px; }
  .segs button.on { background: color-mix(in srgb, var(--accent) 86%, black); color: #08110f; }
  :root[data-theme="light"] .segs button.on { background: var(--accent-fill); color: #fff; }

  .today-line { font-size: 12px; color: var(--secondary); margin-top: 16px; }
  .today-line b { color: var(--label); font-weight: 600; }
  body.type-view #today-line { display: none; }
</style>
</head>
<body>
 <div class="panel">
  <div class="nav">
    <h1>기록</h1>
    <button class="close" id="btn-close" title="닫기 (Esc)" aria-label="닫기"></button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="body">
    <div class="detail" id="detail">
      <div class="d-next" id="d-next">--:--</div>
      <div class="d-when" id="d-when"></div>
      <div class="d-act">
        <button class="btn primary" id="d-now">지금 하기</button>
      </div>
    </div>

    <div class="summary" id="summary">
      <div class="streak-row">
        <div class="big"><b id="streak-cur">0</b>일 연속</div>
        <div class="cap">최고 <b id="streak-best">0</b>일</div>
      </div>
    </div>

    <div class="grass-wrap"><div class="grass" id="grass"></div></div>
    <div class="legend">
      <span>적음</span>
      <span class="cell"></span>
      <span class="cell" data-lv="1"></span>
      <span class="cell" data-lv="2"></span>
      <span class="cell" data-lv="3"></span>
      <span class="cell" data-lv="4"></span>
      <span>많음</span>
    </div>

    <div class="today-line" id="today-line"></div>

    <div class="range">
      <span class="rlab">기간</span>
      <div class="segs" id="range">
        <button data-w="8">8주</button>
        <button data-w="15">15주</button>
        <button data-w="26">26주</button>
        <button data-w="52">1년</button>
      </div>
    </div>
  </div>
 </div>

<script>
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const root = document.documentElement;
  if (params.get('material') === 'css') document.body.classList.add('no-glass');
  // 테마와 유리 진하기는 theme.js 가 입힌다 (윈도우 테마를 바꾸면 다시 열지 않아도 따라온다)

  const LEVEL_ALPHA = [0, 0.28, 0.5, 0.74, 1];
  let current = params.get('focus') || null;   // 선택된 종류 id (null = 전체)
  let weeks = 15;

  // 탭 줄 넘기기 — 휠과 드래그 둘 다. 창이 좁아 탭은 거의 항상 잘린다.
  const tabsEl = $('tabs');
  tabsEl.addEventListener('wheel', (e) => {
    const d = e.deltaY || e.deltaX;
    if (d) { tabsEl.scrollLeft += d; e.preventDefault(); }
  }, { passive: false });

  let tdrag = null;
  tabsEl.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    tdrag = { x: e.clientX, left: tabsEl.scrollLeft, moved: false };
  });
  tabsEl.addEventListener('pointermove', (e) => {
    if (!tdrag) return;
    const dx = e.clientX - tdrag.x;
    if (!tdrag.moved && Math.abs(dx) > 3) {
      tdrag.moved = true;
      tabsEl.classList.add('dragging');       // 끄는 중엔 탭 클릭을 막는다
      try { tabsEl.setPointerCapture(e.pointerId); } catch {}
    }
    if (tdrag.moved) tabsEl.scrollLeft = tdrag.left - dx;
  });
  const endTabDrag = (e) => {
    if (!tdrag) return;
    tdrag = null;
    tabsEl.classList.remove('dragging');
    try { tabsEl.releasePointerCapture(e.pointerId); } catch {}
  };
  tabsEl.addEventListener('pointerup', endTabDrag);
  tabsEl.addEventListener('pointercancel', endTabDrag);

  $('btn-close').append(window.nunsIcon('close'));
  $('btn-close').onclick = () => window.nunsseom.statsClose();
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.nunsseom.statsClose(); });

  function fmtLeft(sec) {
    if (sec == null) return '';
    if (sec >= 3600) { const h = Math.floor(sec / 3600); const m = Math.round((sec % 3600) / 60); return m ? `${h}시간 ${m}분` : `${h}시간`; }
    if (sec >= 60) return `${Math.floor(sec / 60)}분`;
    return `${sec}초`;
  }
  function fmtClock(sec) {
    const at = new Date(Date.now() + sec * 1000);
    return `${String(at.getHours()).padStart(2, '0')}:${String(at.getMinutes()).padStart(2, '0')}`;
  }

  // 최근 본 종류를 앞에 두기 위한 순서 (id 배열, 최근 것 먼저)
  let mru = [];
  let lastCentered;   // 마지막으로 화면 가운데로 끌어온 탭 (선택이 바뀔 때만 갱신)

  function renderTabs(tabs) {
    const host = $('tabs');
    host.textContent = '';
    let onEl = null;
    const mk = (id, name, glyph, emoji, color) => {
      const on = (current || null) === (id || null);
      const b = document.createElement('button');
      b.className = 'tab' + (on ? ' on' : '');
      // 색은 --c 로만 넘긴다. 켜진 탭 바탕·글리프 색은 CSS(.tab)가 테마에 맞춰 만든다
      if (color) b.style.setProperty('--c', color);
      if (glyph || emoji) {
        const g = window.nunsMark(emoji ? { emoji } : glyph);
        if (color) g.style.color = on ? 'inherit' : 'var(--mark)';
        b.append(g);
      }
      const t = document.createElement('span');
      t.textContent = name;
      b.append(t);
      b.onclick = () => {
        if (id) { mru = [id, ...mru.filter((x) => x !== id)]; } // 방금 본 것을 맨 앞으로
        current = id || null;
        load();
      };
      host.append(b);
      if (on) onEl = b;
    };

    mk(null, '전체', 'eye', null, 'var(--accent)');

    // 최근 본 순서로 종류 탭을 정렬 (mru에 있는 것 먼저, 나머지는 원래 순서)
    const byId = new Map(tabs.map((t) => [t.id, t]));
    const ordered = [];
    for (const id of mru) if (byId.has(id)) { ordered.push(byId.get(id)); byId.delete(id); }
    for (const t of tabs) if (byId.has(t.id)) ordered.push(t);
    for (const t of ordered) mk(t.id, t.name, t.glyph, t.emoji, t.color);

    // 선택이 바뀐 순간에만 그 탭을 보이게 한다.
    // 다시 그릴 때마다 하면, 사용자가 옆으로 밀어둔 스크롤을 매번 도로 끌어당긴다.
    if (onEl && lastCentered !== (current || null)) {
      lastCentered = current || null;
      onEl.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
    }
  }

  function paintGrass(cells, max, accent) {
    const host = $('grass');
    host.textContent = '';
    const level = (v) => { if (v <= 0) return 0; const r = v / Math.max(1, max); return r < 0.28 ? 1 : r < 0.55 ? 2 : r < 0.8 ? 3 : 4; };
    for (const c of cells) {
      const el = document.createElement('span');
      el.className = 'cell' + (c.future ? ' future' : '');
      const lv = level(c.count);
      if (lv > 0) {
        el.dataset.lv = lv;   // 라이트 테두리(CSS)가 채운 칸을 이것으로 고른다 — 범례 칸과 같은 표시
        el.style.background = `color-mix(in srgb, ${accent} ${Math.round(LEVEL_ALPHA[lv] * 100)}%, transparent)`;
      }
      host.append(el);
    }
  }

  function paintLegend(accent) {
    document.querySelectorAll('.legend .cell[data-lv]').forEach((el) => {
      el.style.background = `color-mix(in srgb, ${accent} ${Math.round(LEVEL_ALPHA[+el.dataset.lv] * 100)}%, transparent)`;
    });
  }

  async function load() {
    const d = await window.nunsseom.statsData(current);
    weeks = d.weeks;
    // 종류를 고르면 그 색을 --type 으로 넘기고, 전체면 지워 CSS 기본 강조색(teal)으로 돌아간다.
    // --accent 에 바로 넣으면 안 된다 — 인라인 값이 라이트 규칙을 이겨 흰 유리 위에 파스텔 글자가 남는다.
    // 테마별 강조색은 body.type-view 가 --type 에서 만든다.
    if (d.detail) root.style.setProperty('--type', d.detail.color);
    else root.style.removeProperty('--type');
    const accent = 'var(--accent)';

    document.body.classList.toggle('type-view', !!d.selected);
    document.body.classList.toggle('all-view', !d.selected);

    renderTabs(d.tabs);

    if (d.selected && d.detail) {
      const streakTxt = d.streak.current > 0 ? ` · 연속 ${d.streak.current}일` : '';
      if (d.detail.remaining != null) {
        $('d-next').textContent = fmtClock(d.detail.remaining);
        $('d-when').textContent = '';
        const b = document.createElement('b');
        b.textContent = fmtLeft(d.detail.remaining);
        $('d-when').append(b, ` 후 · 오늘 ${d.today}회${streakTxt}`);
      } else {
        $('d-next').textContent = '--:--';
        $('d-when').textContent = `꺼진 알림 · 오늘 ${d.today}회${streakTxt}`;
      }
      $('d-now').onclick = () => window.nunsseom.statsBreakNow(d.selected);
    } else {
      $('streak-cur').textContent = d.streak.current;
      $('streak-best').textContent = d.streak.best;
      const tl = $('today-line');
      tl.textContent = '';
      tl.append('오늘 ');
      const tb = document.createElement('b');
      tb.textContent = d.today + '회';
      tl.append(tb, ' 완료');
    }

    paintGrass(d.grass, d.max, accent);
    paintLegend(accent);

    document.querySelectorAll('#range button').forEach((b) => b.classList.toggle('on', +b.dataset.w === weeks));
  }

  document.querySelectorAll('#range button').forEach((btn) => {
    btn.onclick = () => {
      weeks = +btn.dataset.w;
      window.nunsseom.statsSetWeeks(weeks);
      load();
    };
  });

  window.nunsseom.onStatsChanged(() => load());
  window.nunsseom.onStatsFocus((id) => { current = id || null; load(); });

  load();
  // 다음 알림 카운트다운이 흐르도록 주기적으로 갱신
  setInterval(() => { if (document.body.classList.contains('type-view')) load(); }, 30000);
</script>
</body>
</html>
