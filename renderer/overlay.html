<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/font/pretendard.css">
<script src="icons.js"></script>
<script src="sound.js"></script>
<style>
  :root {
    --label: rgba(255, 255, 255, 0.96);
    --secondary: rgba(235, 235, 245, 0.62);
    --tertiary: rgba(235, 235, 245, 0.34);
    --fill: rgba(255, 255, 255, 0.12);
    --fill-hi: rgba(255, 255, 255, 0.22);
    --hairline: rgba(255, 255, 255, 0.20);
    --tint: #5ecfb6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI Variable Display', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    /* 세로로 쌓는다 — 단추는 내용 «위에 떠 있는» 것이 아니라 «아래에 놓이는» 것이다.
       예전엔 .actions가 position:fixed라, 체크할 항목이 많으면 목록 마지막 줄이
       단추 뒤로 깔려 읽을 수도 누를 수도 없었다. */
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: fadein 0.55s ease both;
    cursor: default;
  }
  @keyframes fadein { from { opacity: 0; } }

  /* 휴식 직전 캡처한 바탕화면을 실제로 블러 (frameless 전체화면에서 가장 안정적) */
  .backdrop {
    position: fixed; inset: 0; z-index: -2;
    background-size: cover; background-position: center;
    filter: blur(44px) saturate(1.25) brightness(0.58);
    transform: scale(1.12);
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .backdrop.ready { opacity: 1; }
  .scrim { position: fixed; inset: 0; z-index: -1; background: rgba(16, 16, 20, 0.56); }

  .stage {
    text-align: center; animation: rise 0.75s cubic-bezier(0.2, 0.8, 0.2, 1) both 0.1s;
    /* 남는 높이를 다 쓰되, 넘치면 이 안에서 굴린다 (창 전체는 여전히 안 굴러간다).
       min-height:0이 없으면 flex 항목이 내용 높이 아래로 안 줄어들어 넘침이 밖으로 샌다. */
    flex: 1 1 auto; min-height: 0; width: 100%;
    overflow-y: auto; overscroll-behavior: contain;
    display: flex; flex-direction: column; align-items: center;
    /* 짧으면 가운데, 넘치면 위에서부터. safe가 없으면 넘칠 때 윗부분이 잘려 못 본다. */
    justify-content: safe center;
    padding: 24px 24px 6px;
  }
  /* 휴식 화면에서 스크롤 막대는 군더더기다 — 굴러가되 보이지는 않게 */
  .stage::-webkit-scrollbar { width: 0; height: 0; }
  /* to를 명시해야 한다 — 생략하면 요소 자신의 opacity(0)가 종료 상태가 되어 끝까지 안 보인다 */
  @keyframes rise {
    from { opacity: 0; transform: translateY(18px) scale(0.99); }
    to { opacity: 1; transform: none; }
  }

  .kicker {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 640; letter-spacing: 0.01em;
    color: var(--tint);
    margin-bottom: 34px;
  }
  .kicker svg { width: 17px; height: 17px; }
  .kicker .emoji { font-size: 16px; line-height: 1; display: inline-grid; place-items: center; }
  .list .item .g.emoji { font-size: 16px; line-height: 1; display: inline-grid; place-items: center; }

  /* 숨쉬는 유리 원 */
  .breath { position: relative; width: 312px; height: 312px; margin: 0 auto 36px; display: grid; place-items: center; }
  .breath .disc {
    position: absolute; inset: 0; border-radius: 50%;
    background: linear-gradient(160deg, rgba(255,255,255,0.13), rgba(255,255,255,0.04) 62%);
    box-shadow:
      inset 0 0 0 0.5px var(--hairline),
      inset 0 1px 0 rgba(255,255,255,0.30),
      0 24px 60px rgba(0,0,0,0.28);
    animation: breathe 5.5s ease-in-out infinite;
  }
  .breath .halo {
    position: absolute; inset: -26px; border-radius: 50%;
    box-shadow: inset 0 0 0 0.5px color-mix(in srgb, var(--tint) 26%, transparent);
    animation: breathe 5.5s ease-in-out infinite reverse;
  }
  @keyframes breathe { 0%, 100% { transform: scale(0.96); } 50% { transform: scale(1.04); } }
  @media (prefers-reduced-motion: reduce) {
    .breath .disc, .breath .halo { animation: none; }
  }
  .count {
    position: relative;
    font-size: 100px; font-weight: 210;
    color: var(--label);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.05em;
    line-height: 1;
  }
  .count small { font-size: 27px; font-weight: 420; letter-spacing: 0; color: var(--secondary); margin-left: 6px; }

  /* 체크리스트가 길면 숨쉬는 원이 자리를 다 차지한다. 그때는 원을 줄여 목록에 자리를 준다 —
     이 화면의 주인공이 «남은 시간»에서 «해야 할 것»으로 바뀌는 순간이기 때문이다. */
  body.dense .kicker { margin-bottom: 18px; }
  body.dense .breath { width: 148px; height: 148px; margin: 0 auto 18px; }
  body.dense .breath .halo { inset: -14px; }
  body.dense .count { font-size: 46px; }
  body.dense .count small { font-size: 15px; margin-left: 4px; }
  body.dense .headline { font-size: 19px; }
  body.dense .list { margin-top: 16px; }

  /* 그래도 안 들어가면 한 단 더 조인다. 12px 넘쳤다고 굴리게 만들면
     «다 보이는데 왜 굴려야 하지»가 된다 — 줄이 몇이든 한눈에 들어오는 편이 낫다. */
  body.denser .kicker { margin-bottom: 10px; }
  body.denser .breath { width: 92px; height: 92px; margin: 0 auto 10px; }
  body.denser .breath .halo { inset: -8px; }
  body.denser .count { font-size: 30px; }
  body.denser .count small { font-size: 12px; margin-left: 3px; }
  body.denser .headline { font-size: 17px; }
  body.denser .subline { display: none; }   /* «하나씩 눌러 체크해보세요» — 줄 모양만 봐도 안다 */
  body.denser .list { margin-top: 10px; gap: 6px; }
  body.denser .list .item { padding: 8px 16px 8px 10px; font-size: 14.5px; }
  body.denser .list .item .box { width: 20px; height: 20px; }

  .headline { font-size: 21px; font-weight: 620; letter-spacing: -0.02em; color: var(--label); }
  .subline { font-size: 13.5px; color: var(--secondary); margin-top: 8px; }

  /* 묶음/긴 휴식 체크리스트 */
  .list { margin-top: 22px; display: inline-flex; flex-direction: column; gap: 8px; text-align: left; }
  .list .item {
    display: flex; align-items: center; gap: 12px;
    font-size: 15.5px; font-weight: 540; letter-spacing: -0.015em;
    color: var(--label);
    background: var(--fill);
    box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.11);
    padding: 11px 20px 11px 12px;
    border-radius: 999px;
    min-width: 300px;
    animation: rise 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    transition: background 0.15s;
  }
  .list .item:hover { background: var(--fill-hi); }
  .list .item .box {
    width: 23px; height: 23px; flex: none; border-radius: 50%;
    box-shadow: inset 0 0 0 1.5px var(--tertiary);
    display: grid; place-items: center;
    color: #fff; transition: background 0.18s, box-shadow 0.18s;
  }
  .list .item .box svg { width: 13px; height: 13px; opacity: 0; }
  .list .item .g { width: 17px; height: 17px; flex: none; color: var(--itc, var(--tint)); }
  .list .item.done { color: var(--secondary); }
  .list .item.done .box { background: var(--itc, var(--tint)); box-shadow: none; }
  .list .item.done .box svg { opacity: 1; }

  .actions {
    /* 흐름 안에 둔다 — 목록이 길어도 그 아래에 놓이지, 위를 덮지 않는다 */
    flex: none; width: 100%;
    padding: 14px 24px 46px;
    display: flex; justify-content: center; gap: 10px;
    animation: fadein 0.7s ease both 1.3s;
  }
  .actions button {
    all: unset; cursor: default;
    font-family: inherit; font-size: 13px; font-weight: 540; letter-spacing: -0.01em;
    color: var(--secondary);
    padding: 10px 20px; border-radius: 999px;
    background: var(--fill);
    box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.11);
    transition: background 0.15s, color 0.15s;
  }
  .actions button:hover { background: var(--fill-hi); color: var(--label); }
  .actions button:focus-visible { box-shadow: 0 0 0 2px color-mix(in srgb, var(--tint) 65%, transparent); }

  /* 일찍 끝내기 — 체크를 다 하면 강조된다 */
  .actions button.finish {
    color: var(--label);
    font-weight: 640;
    background: color-mix(in srgb, var(--tint) 26%, transparent);
    box-shadow: inset 0 0 0 0.5px color-mix(in srgb, var(--tint) 45%, transparent);
    padding-left: 16px;
  }
  .actions button.finish:hover { background: color-mix(in srgb, var(--tint) 38%, transparent); }
  .actions button.finish.ready {
    background: color-mix(in srgb, var(--tint) 86%, black);
    color: #fff;
    box-shadow: none;
  }
</style>
</head>
<body>
  <div class="backdrop" id="backdrop"></div>
  <div class="scrim"></div>

  <div class="stage">
    <div class="kicker" id="kicker"></div>
    <div class="breath">
      <div class="halo"></div>
      <div class="disc"></div>
      <div class="count" id="count">20<small>초</small></div>
    </div>
    <div class="headline" id="headline"></div>
    <div class="subline" id="subline"></div>
    <div class="list" id="list"></div>
  </div>

  <div class="actions">
    <button id="btn-finish" class="finish" title="남은 시간을 기다리지 않고 끝내기"><span id="finish-label">다 했어요</span></button>
    <button id="btn-snooze">5분 뒤에</button>
    <button id="btn-skip">건너뛰기</button>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const qs = new URLSearchParams(location.search);
  const isMain = qs.get('main') === 'true';
  // 설정이 도착하기 전까지는 «막지 않음»이 안전한 쪽이다 — 잘못 막아 갇히는 것보다 낫다
  let noEscape = false;
  const displayId = qs.get('display');

  // 이 창은 휴식이 오기 전에 미리 만들어져 숨어 있다가, 그때가 되면 보여진다.
  // 창을 만들고 이 파일을 읽는 데 0.4초가 걸리는데, 그걸 «그 순간»에 하면
  // 알림이 그만큼 늦게 뜬다 — 정해진 시각 알람은 특히 티가 난다.
  // 그래서 내용도 «언제 끝나는지»도 시작 신호와 함께 받는다.
  let endsAt = Date.now() + 20_000;
  let started = false;

  function begin(p) {
    if (started || !p || !p.items || !p.items.length) return;
    started = true;
    if (p.endsAt) endsAt = Number(p.endsAt);
    tick();
    render(p);

    // 미리 찍어둔 바탕화면 — 없으면 그냥 없이 간다
    window.nunsseom.getOverlayBg(displayId).then((url) => {
      if (!url) return;
      const bd = $('backdrop');
      bd.style.backgroundImage = `url("${url}")`;
      requestAnimationFrame(() => bd.classList.add('ready'));
    }).catch(() => {});

    // 알림음 (주 모니터에서만 — 여러 화면에서 같이 울리면 겹쳐 들린다)
    if (isMain && p.sound && p.sound.enabled) {
      window.nunsSound.play(p.sound.name, p.sound.volume);
    }
  }

  // 미리 만들어 둔 창은 여기서 시작 신호를 기다린다
  window.nunsseom.onBreakBegin(begin);
  // 예비가 없어 그때 만들어진 창이라면 이미 시작돼 있다 — 바로 받아온다
  window.nunsseom.getBreakPayload().then(begin).catch(() => {});

  function render(p) {
    const first = p.items[0];
    document.documentElement.style.setProperty('--tint', first.color);

    // «건너뛰기»·«다 했어요»를 숨기는 설정. 두 단추가 있으면 알림이 뜰 때마다
    // 반사적으로 눌러 넘기게 되어 휴식이 이름만 남는다.
    // 갇히지는 않는다 — 시간이 끝나면 메인이 알아서 닫는다.
    // «5분 뒤에»는 남긴다. 지금 당장 못 쉬는 때가 있고, 그건 넘기는 게 아니라 미루는 것이다.
    if (p.noEscape) {
      $('btn-finish').style.display = 'none';
      $('btn-skip').style.display = 'none';
      noEscape = true;
    }

    // 상단 킥커 — 묶음이면 개수 표기
    const kicker = $('kicker');
    kicker.textContent = '';
    kicker.append(window.nunsMark(first));
    const kt = document.createElement('span');
    kt.textContent = p.grouped ? `${first.name} 외 ${p.items.length - 1}개` : first.name;
    kicker.append(kt);

    if (p.mode === 'single') {
      const tip = first.tip;
      $('headline').textContent = tip ? tip[0] : first.headline;
      $('subline').textContent = tip && tip[1] ? tip[1] : '';
      return;
    }

    // 체크리스트 모드 — 묶음이거나 긴 휴식
    $('headline').textContent = p.grouped ? '한 번에 처리해 주세요' : first.headline;
    $('subline').textContent = '하나씩 눌러 체크해보세요';

    const rows = [];
    for (const item of p.items) {
      if (item.checklist && item.checklist.length) {
        for (const text of item.checklist) rows.push({ text, glyph: item.glyph, emoji: item.emoji, color: item.color });
      } else {
        rows.push({ text: item.tip ? item.tip[0] : item.headline, glyph: item.glyph, emoji: item.emoji, color: item.color });
      }
    }

    const host = $('list');
    host.textContent = '';
    rows.forEach((row, i) => {
      const el = document.createElement('div');
      el.className = 'item';
      el.style.animationDelay = `${0.75 + i * 0.12}s`;
      el.style.setProperty('--itc', row.color);

      const box = document.createElement('span');
      box.className = 'box';
      box.append(window.nunsIcon('check'));

      el.append(box, window.nunsMark(row, 'g'));
      const label = document.createElement('span');
      label.textContent = row.text;
      el.append(label);

      el.onclick = () => { el.classList.toggle('done'); refreshFinish(); };
      host.append(el);
    });
    refreshFinish();
    fitStage();
  }

  /**
   * 화면에 안 들어가면 좁은 배치로 바꾼다.
   *
   * 항목 수로 어림잡지 않는다 — 같은 일곱 줄도 화면 높이와 배율에 따라 들어가기도,
   * 안 들어가기도 한다. 실제로 재서 넘칠 때만 줄인다.
   * 그래도 넘치면 .stage 안에서 굴러간다(단추는 늘 그 아래에 있다).
   */
  function fitStage() {
    const stage = document.querySelector('.stage');
    if (!stage) return;
    // 넉넉한 배치부터 시작해, 넘칠 때만 한 단씩 조인다.
    // 항목 수로 어림잡지 않는 이유: 같은 일곱 줄도 화면 높이와 배율에 따라
    // 들어가기도 하고 안 들어가기도 한다.
    const body = document.body;
    body.classList.remove('dense', 'denser');
    const over = () => stage.scrollHeight > stage.clientHeight + 1;
    if (!over()) return;
    body.classList.add('dense');
    if (!over()) return;
    body.classList.add('denser');
    // 여기서도 넘치면 그때는 굴린다 — 더 조이면 읽기가 힘들어진다
  }

  /** 체크 진행도에 따라 완료 버튼 상태를 갱신 */
  function refreshFinish() {
    const items = document.querySelectorAll('.list .item');
    const btn = $('btn-finish');
    const label = $('finish-label');
    if (!items.length) { label.textContent = '다 했어요'; return; }
    const done = document.querySelectorAll('.list .item.done').length;
    const all = done === items.length;
    btn.classList.toggle('ready', all);
    label.textContent = all ? '완료' : `다 했어요 (${done}/${items.length})`;
  }

  // 카운트다운 (종료는 메인 프로세스가 담당)
  function tick() {
    const remain = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
    const c = $('count');
    c.textContent = '';
    if (remain >= 60) {
      c.append(`${Math.floor(remain / 60)}:${String(remain % 60).padStart(2, '0')}`);
    } else {
      c.append(String(remain));
      const s = document.createElement('small');
      s.textContent = '초';
      c.append(s);
    }
  }
  tick();
  setInterval(tick, 250);

  $('btn-finish').onclick = () => window.nunsseom.finish();
  $('btn-snooze').onclick = () => window.nunsseom.snooze();
  $('btn-skip').onclick = () => window.nunsseom.skip();

  // 키보드: Enter/Space = 완료, Esc = 건너뛰기
  // 단추를 숨겼으면 이 지름길도 같이 막는다 — 안 그러면 Esc 한 번으로 그대로 넘어가서
  // 숨긴 것이 아무 뜻이 없다 (단추만 감추고 길은 열어두는 셈이 된다).
  window.addEventListener('keydown', (e) => {
    if (noEscape) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); window.nunsseom.finish(); }
    else if (e.key === 'Escape') window.nunsseom.skip();
  });
</script>
</body>
</html>
