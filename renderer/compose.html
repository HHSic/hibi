<!DOCTYPE html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src file: 'unsafe-inline'; style-src file: 'unsafe-inline'; font-src file:; img-src data:">
<title>메일 쓰기</title>
<style>
  :root {
    --scrim-a: 0.86;
    --scrim: rgba(28, 28, 32, var(--scrim-a));
    --label: rgba(255, 255, 255, 0.96);
    --secondary: rgba(235, 235, 245, 0.62);
    --tertiary: rgba(235, 235, 245, 0.34);
    --separator: rgba(255, 255, 255, 0.12);
    --fill: rgba(255, 255, 255, 0.07);
    --fill-hi: rgba(255, 255, 255, 0.16);
    --accent: #4fc3a8;
    --danger: #ff8b8b;
    --r: 20px;
  }
  :root[data-theme="light"] {
    --scrim: rgba(252, 252, 254, var(--scrim-a));
    --label: rgba(0, 0, 0, 0.90);
    --secondary: rgba(60, 60, 67, 0.62);
    --tertiary: rgba(60, 60, 67, 0.32);
    --separator: rgba(0, 0, 0, 0.10);
    --fill: rgba(0, 0, 0, 0.05);
    --fill-hi: rgba(0, 0, 0, 0.10);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: transparent; }
  body {
    font-family: Pretendard, -apple-system, "Segoe UI", system-ui, sans-serif;
    color: var(--label); font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  /* 리사이즈 존이 창 밖으로 나가지 않도록 위치 기준을 여기서 잡는다 */
  .stage { position: relative; width: 100%; height: 100%; }
  .card {
    position: absolute; inset: var(--inset, 12px);
    display: flex; flex-direction: column;
    background: var(--scrim); border-radius: var(--r);
    box-shadow: 0 18px 46px rgba(0, 0, 0, 0.42), inset 0 0 0 0.5px var(--separator);
    overflow: hidden;
  }

  .head {
    flex: none; padding: 12px 14px 10px;
    display: flex; align-items: center; gap: 10px; cursor: default;
  }
  .head .ttl { flex: 1; font-size: 13.5px; font-weight: 650; }
  .close {
    all: unset; cursor: default; width: 22px; height: 22px; border-radius: 6px;
    display: grid; place-items: center; color: var(--secondary); font-size: 15px;
  }
  .close:hover { background: var(--fill); color: var(--label); }

  .fields { flex: none; padding: 0 14px; display: flex; flex-direction: column; }
  .fld {
    display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 8px;
    padding: 7px 0; box-shadow: inset 0 -0.5px 0 var(--separator);
  }
  .fld .lb { font-size: 11.5px; color: var(--tertiary); }
  .fld input {
    all: unset; font-family: inherit; font-size: 12.5px; color: var(--label);
    width: 100%; min-width: 0;
  }
  .fld input::placeholder { color: var(--tertiary); }
  .fld .more {
    all: unset; cursor: default; font-size: 11px; color: var(--secondary);
    padding: 2px 6px; border-radius: 6px;
  }
  .fld .more:hover { background: var(--fill); color: var(--label); }
  .fld.hide { display: none; }
  .fld select {
    all: unset; font-family: inherit; font-size: 11.5px; color: var(--secondary);
    background: var(--fill); border-radius: 7px; padding: 3px 7px; max-width: 190px;
  }
  .fld select option { background: #24242a; color: #fff; }

  /* 이름으로 찾는 주소록 목록.
     <datalist>는 값(주소)으로만 걸러서 «김부장»을 쳐도 아무것도 안 나온다 — 직접 만든다. */
  .fld { position: relative; }
  .book {
    position: absolute; z-index: 20; left: 52px; right: 0; top: 100%;
    background: #26262c; border-radius: 9px; padding: 4px;
    box-shadow: 0 10px 26px rgba(0,0,0,0.45), inset 0 0 0 0.5px var(--separator);
    max-height: 190px; overflow-y: auto; display: none;
  }
  :root[data-theme="light"] .book { background: #fff; }
  .book.on { display: block; }
  .book .it {
    display: flex; align-items: baseline; gap: 7px;
    padding: 5px 8px; border-radius: 6px; cursor: default; font-size: 12px;
  }
  .book .it b { font-weight: 600; color: var(--label); }
  .book .it span { color: var(--tertiary); font-size: 11px; }
  .book .it.on, .book .it:hover { background: var(--fill-hi); }
  .book .none { padding: 6px 8px; font-size: 11.5px; color: var(--tertiary); }
  .helprow { display: flex; gap: 4px; align-items: center; }

  /* 주소록 창 — 타이핑 없이 골라 넣는다 */
  .picker {
    position: absolute; inset: 0; z-index: 40; display: none;
    /* 뒤가 비치면 안 된다 — 아래 입력칸 글자와 겹쳐 둘 다 안 읽힌다 */
    background: #1e1e23; border-radius: var(--r);
    flex-direction: column; padding: 12px 14px 12px;
  }
  :root[data-theme="light"] .picker { background: #fbfbfd; }
  .picker.on { display: flex; }
  .picker .ptop { display: flex; align-items: center; gap: 8px; flex: none; }
  .picker .ptop b { flex: 1; font-size: 13.5px; font-weight: 650; }
  .picker input.find {
    all: unset; font-family: inherit; font-size: 12.5px; color: var(--label);
    background: var(--fill); border-radius: 8px; padding: 7px 10px;
    margin: 10px 0 8px; flex: none;
  }
  .picker input.find::placeholder { color: var(--tertiary); }
  .plist { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -4px; }
  .plist::-webkit-scrollbar { width: 6px; }
  .plist::-webkit-scrollbar-thumb { background: transparent; border-radius: 3px; transition: background 0.15s; }
  .plist:hover::-webkit-scrollbar-thumb { background: var(--fill-hi); }
  .prow {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 8px; border-radius: 8px; cursor: default;
  }
  .prow:hover { background: var(--fill); }
  .prow.on { background: color-mix(in srgb, var(--accent) 17%, transparent); }
  .prow .mark {
    width: 15px; height: 15px; border-radius: 4px; flex: none;
    box-shadow: inset 0 0 0 1.2px var(--fill-hi);
    display: grid; place-items: center; font-size: 10px; color: #06231d;
  }
  .prow.on .mark { background: var(--accent); box-shadow: none; }
  .prow .who { flex: 1; min-width: 0; }
  .prow .who b { display: block; font-size: 12.5px; font-weight: 600; }
  .prow .who span { display: block; font-size: 11px; color: var(--tertiary);
                    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pfoot { flex: none; display: flex; align-items: center; gap: 6px; padding-top: 10px;
           box-shadow: inset 0 0.5px 0 var(--separator); }
  .pfoot .cnt { flex: 1; font-size: 11.5px; color: var(--secondary); }

  /* 서식 막대 — 받는 사람 칸과 본문 사이 */
  .bar {
    flex: none; display: flex; align-items: center; gap: 3px; flex-wrap: wrap;
    padding: 6px 12px; box-shadow: inset 0 -0.5px 0 var(--separator);
  }
  .bar select {
    all: unset; font-family: inherit; font-size: 11px; color: var(--secondary);
    background: var(--fill); border-radius: 6px; padding: 3px 6px;
  }
  .bar select option { background: #24242a; color: #fff; }
  .bar button {
    all: unset; cursor: default; min-width: 22px; height: 22px; border-radius: 6px;
    display: grid; place-items: center; color: var(--secondary);
    font-size: 12px; padding: 0 4px;
  }
  .bar button:hover { background: var(--fill); color: var(--label); }
  .bar button.on { background: var(--fill-hi); color: var(--label); }
  .bar .sep { width: 1px; height: 14px; background: var(--separator); margin: 0 3px; }
  .bar input[type=color] {
    all: unset; width: 20px; height: 20px; border-radius: 5px; overflow: hidden; cursor: default;
  }

  /* 본문 — 메일은 흰 종이가 기본이다. 받는 사람 화면에서 보이는 대로 여기서도 보여준다. */
  .body {
    flex: 1; min-height: 0; overflow-y: auto;
    background: #fff; color: #1a1a1a;
    font-family: "맑은 고딕", "Malgun Gothic", Pretendard, sans-serif;
    font-size: 14px; line-height: 1.7;
    padding: 14px 16px; outline: none;
    /* 한글은 아무 글자 사이에서나 줄이 넘어간다 — 크롬 기본값이 그렇다.
       그래서 «에스티씨엔지니」/«어링»처럼 낱말 한가운데가 잘려서 자간이 들쭉날쭉해 보인다.
       keep-all은 띄어쓰기에서만 넘기게 한다 (한국어 조판의 기본).
       대신 띄어쓰기 없는 긴 주소가 창을 밀어내므로 그건 anywhere로 따로 풀어준다. */
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .body:empty::before { content: attr(data-ph); color: #9aa0a6; }
  .body img { max-width: 100%; height: auto; }
  /* 서명은 대개 표로 짜여 있다. 이 창에 doctype이 빠져 있던 동안 표 안 글자가
     흰 종이 위에서 흰색으로 나왔다 — quirks mode에서 크롬은 표의 색을 부모가 아니라
     페이지 <body>(다크 테마라 흰색)에서 물려받게 한다.
     doctype으로 고쳤지만, 표가 색을 물려받는 길을 여기서 한 번 더 못박아 둔다.
     서명이 제 색을 지정했으면 인라인 스타일이 이겨서 그대로 나온다. */
  .body table, .body td, .body th, .body tbody, .body tr { color: inherit; }
  .body::-webkit-scrollbar { width: 8px; }
  .body::-webkit-scrollbar-thumb { background: transparent; border-radius: 4px; transition: background 0.15s; }
  .body:hover::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.22); }
  /* 인용문 — 아웃룩·지메일과 같은 모양. 왼쪽 세로줄 하나로 «여기부터는 남이 쓴 글»을 말한다.
     예전엔 줄마다 «> »를 찍었는데, 답장에 답장을 하면 «> > >»로 불어나 글이 안 읽혔다. */
  .qhead {
    margin: 14px 0 0; padding-top: 10px; border-top: 1px solid #e3e5e9;
    font-size: 12.5px; color: #6b7076;
  }
  .body blockquote {
    margin: 6px 0 0; padding: 2px 0 2px 12px;
    border-left: 2px solid #d7dae0; color: #4a4f55;
  }
  /* 인용문 안의 표는 대개 서명이다. 원문 너비를 그대로 들고 오면 창을 밀어낸다. */
  .body blockquote table { max-width: 100%; }
  .body blockquote img { max-width: 100%; height: auto; }

  .files { flex: none; padding: 0 14px 6px; display: flex; flex-wrap: wrap; gap: 5px; }
  .file {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; color: var(--secondary);
    background: var(--fill); border-radius: 7px; padding: 4px 6px 4px 8px;
  }
  .file b { font-weight: 500; color: var(--label); max-width: 160px; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap; }
  .file button {
    all: unset; cursor: default; color: var(--tertiary); font-size: 13px; line-height: 1;
    padding: 0 2px; border-radius: 4px;
  }
  .file button:hover { color: var(--danger); }

  .foot {
    flex: none; padding: 10px 14px 12px;
    display: flex; align-items: center; gap: 8px;
    box-shadow: inset 0 0.5px 0 var(--separator);
  }
  .msg { flex: 1; font-size: 11.5px; color: var(--secondary); min-width: 0; }
  .msg.bad { color: var(--danger); }
  .msg.good { color: var(--accent); }
  button.act {
    all: unset; cursor: default; font-family: inherit;
    font-size: 12px; font-weight: 600; padding: 7px 14px; border-radius: 9px;
    background: var(--accent); color: #06231d;
  }
  button.act.ghost { background: var(--fill); color: var(--label); font-weight: 500; }
  button.act:hover { filter: brightness(1.08); }
  button.act[disabled] { opacity: 0.45; }

  /* 8방향 크기 조절 — 투명 창에서는 네이티브 리사이즈가 폭주해 직접 만든다 */
  .rz { position: absolute; z-index: 9; }
  .rz.n { top: -3px; left: 10px; right: 10px; height: 8px; cursor: ns-resize; }
  .rz.s { bottom: -3px; left: 10px; right: 10px; height: 8px; cursor: ns-resize; }
  .rz.w { left: -3px; top: 10px; bottom: 10px; width: 8px; cursor: ew-resize; }
  .rz.e { right: -3px; top: 10px; bottom: 10px; width: 8px; cursor: ew-resize; }
  .rz.nw { top: -3px; left: -3px; width: 14px; height: 14px; cursor: nwse-resize; }
  .rz.ne { top: -3px; right: -3px; width: 14px; height: 14px; cursor: nesw-resize; }
  .rz.sw { bottom: -3px; left: -3px; width: 14px; height: 14px; cursor: nesw-resize; }
  .rz.se { bottom: -3px; right: -3px; width: 14px; height: 14px; cursor: nwse-resize; }
</style>

<div class="stage">
  <div class="card">
    <div class="head" id="head">
      <span class="ttl" id="ttl">새 메일</span>
      <button class="close" id="close" title="닫기">✕</button>
    </div>

    <div class="fields">
      <div class="fld">
        <span class="lb">보내는</span>
        <input id="from" readonly>
        <select id="acc" style="display:none"></select>
      </div>
      <div class="fld">
        <span class="lb">받는</span>
        <input id="to" placeholder="이름이나 주소를 넣으세요 (쉼표로 여러 명)" autocomplete="off" autofocus>
        <div class="book" id="book-to"></div>
        <span class="helprow">
          <button class="more" id="btn-open-book">주소록</button>
          <button class="more" id="btn-cc">참조</button>
        </span>
      </div>
      <div class="fld hide" id="row-cc">
        <span class="lb">참조</span>
        <input id="cc" placeholder="참조" autocomplete="off">
        <div class="book" id="book-cc"></div>
        <span></span>
      </div>
      <div class="fld hide" id="row-bcc">
        <span class="lb">숨은참조</span>
        <input id="bcc" placeholder="숨은참조" autocomplete="off">
        <div class="book" id="book-bcc"></div>
        <span></span>
      </div>
      <div class="fld">
        <span class="lb">제목</span>
        <input id="subject" placeholder="제목">
        <span></span>
      </div>
    </div>

    <div class="bar">
      <select id="font" title="글꼴">
        <option value="'맑은 고딕','Malgun Gothic',sans-serif">맑은 고딕</option>
        <option value="'굴림',Gulim,sans-serif">굴림</option>
        <option value="'바탕',Batang,serif">바탕</option>
        <option value="Arial,Helvetica,sans-serif">Arial</option>
        <option value="'Times New Roman',serif">Times</option>
        <option value="Consolas,'D2Coding',monospace">고정폭</option>
      </select>
      <select id="size" title="글자 크기">
        <option value="1">10</option><option value="2">12</option>
        <option value="3" selected>14</option><option value="4">18</option>
        <option value="5">24</option><option value="6">32</option>
      </select>
      <span class="sep"></span>
      <button data-cmd="bold" title="굵게"><b>가</b></button>
      <button data-cmd="italic" title="기울임"><i>가</i></button>
      <button data-cmd="underline" title="밑줄"><u>가</u></button>
      <button data-cmd="strikeThrough" title="취소선"><s>가</s></button>
      <input type="color" id="color" value="#1a1a1a" title="글자색">
      <span class="sep"></span>
      <button data-cmd="insertUnorderedList" title="글머리 기호">•≡</button>
      <button data-cmd="insertOrderedList" title="번호 매기기">1≡</button>
      <button data-cmd="justifyLeft" title="왼쪽 정렬">≡</button>
      <button data-cmd="justifyCenter" title="가운데 정렬">≣</button>
      <span class="sep"></span>
      <button id="btn-image" title="본문에 그림 넣기">그림</button>
      <button id="btn-link" title="링크 넣기">링크</button>
      <button data-cmd="removeFormat" title="서식 지우기">서식 지우기</button>
    </div>

    <div class="body" id="body" contenteditable="true" data-ph="내용을 쓰세요"></div>
    <div class="files" id="files"></div>

    <div class="foot">
      <span class="msg" id="msg"></span>
      <button class="act ghost" id="attach">파일 첨부</button>
      <button class="act" id="send">보내기</button>
    </div>


    <!-- 주소록에서 골라 넣기 — 주소를 외우거나 받아 적을 필요가 없게 -->
    <div class="picker" id="picker">
      <div class="ptop">
        <b>주소록</b>
        <button class="close" id="pk-close" title="닫기">✕</button>
      </div>
      <input type="text" class="find" id="pk-find" placeholder="이름이나 주소로 찾기">
      <div class="plist" id="pk-list"></div>
      <div class="pfoot">
        <span class="cnt" id="pk-cnt">고른 사람 없음</span>
        <button class="act ghost" data-put="cc">참조</button>
        <button class="act ghost" data-put="bcc">숨은참조</button>
        <button class="act" data-put="to">받는 사람</button>
      </div>
    </div>

    <div class="rz n" data-dir="n"></div><div class="rz s" data-dir="s"></div>
    <div class="rz w" data-dir="w"></div><div class="rz e" data-dir="e"></div>
    <div class="rz nw" data-dir="nw"></div><div class="rz ne" data-dir="ne"></div>
    <div class="rz sw" data-dir="sw"></div><div class="rz se" data-dir="se"></div>
  </div>
</div>

<script src="compose.js"></script>
