<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/font/pretendard.css">
<script src="icons.js"></script>
<style>
  /* ── 토큰 ─────────────────────────────────────────────
     블러는 Win11 아크릴이, 틴트는 --scrim이 담당한다.
     모든 치수는 rem이고 루트 폰트크기는 폭·높이 중 더 제약적인 쪽에 맞춰 스케일된다. */
  :root {
    /* 실시간 블러가 없으므로 틴트가 가독성을 담당한다 */
    --scrim-a: 0.92;
    --scrim: rgba(20, 20, 25, var(--scrim-a));
    --inset: 12px;
    --ctlh: 36px;
    --label: rgba(255, 255, 255, 0.96);
    --secondary: rgba(235, 235, 245, 0.60);
    --tertiary: rgba(235, 235, 245, 0.32);
    --fill: rgba(255, 255, 255, 0.13);
    --fill-hi: rgba(255, 255, 255, 0.24);
    --hairline: rgba(255, 255, 255, 0.16);
    --bar: rgba(24, 24, 28, 0.90);
    --sun: #ff8b8b;           /* 달력의 일요일 */
    --tint: #5ecfb6;          /* 다음 알림 종류 색 — JS가 갱신 */
    --p: 0%;                  /* 진행률 */
    --r: 0px;                 /* CSS 코너 반경 (투명 창일 때만 사용) */
  }
  :root[data-theme="light"] {
    --scrim: rgba(252, 252, 254, var(--scrim-a));
    --label: rgba(0, 0, 0, 0.90);
    --secondary: rgba(60, 60, 67, 0.62);
    --tertiary: rgba(60, 60, 67, 0.32);
    --fill: rgba(120, 120, 128, 0.18);
    --fill-hi: rgba(120, 120, 128, 0.32);
    --hairline: rgba(255, 255, 255, 0.60);
    --bar: rgba(250, 250, 252, 0.92);
    --sun: #d94a4a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html { font-size: 16px; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI Variable Display', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    /* 창 안쪽 투명 여백 — 그림자가 드리워지고, 아래쪽엔 컨트롤 띠를 예약한다 */
    padding: var(--inset);
    padding-bottom: calc(var(--inset) + var(--ctlh));
  }

  /* 카드 + 컨트롤 띠를 함께 감싸 hover 판정을 이어준다 */
  .stage { position: relative; width: 100%; height: 100%; }

  .card {
    /* app-region: drag를 쓰면 OS가 마우스 이벤트를 가져가 클릭이 안 잡히므로
       이동은 JS가 직접 처리한다 (아래 포인터 핸들러) */
    cursor: default;
    position: relative;
    width: 100%; height: 100%;
    background: var(--scrim);
    border-radius: var(--r);
    overflow: hidden;
    display: grid;
    box-shadow:
      inset 0 0 0 0.5px var(--hairline),
      0 4px 14px rgba(0, 0, 0, 0.42),
      0 1px 3px rgba(0, 0, 0, 0.28);
  }
  /* 유리 시트 광택 — 위에서 아래로 아주 옅게 */
  .card::before {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(170deg, rgba(255, 255, 255, 0.07) 0%, transparent 42%);
    pointer-events: none;
    z-index: 1;
  }
  /* 상단 하이라이트.
     inset box-shadow로 그리면 라운드 곡선과 만나는 지점에 밝은 점이 뭉치므로,
     양끝을 페이드시킨 1px 라인으로 그린다. */
  .card::after {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 1px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(255, 255, 255, 0.22) 24%,
      rgba(255, 255, 255, 0.22) 76%,
      transparent 100%);
    pointer-events: none;
    z-index: 7;
  }

  /* ── 배경이 프로그레스 (10안) ──
     경계에 선을 두지 않고 부드럽게 사라지게 한다 — 하드 엣지는 얼룩처럼 보인다. */
  .prog {
    position: absolute; inset: 0;
    background: linear-gradient(90deg,
      color-mix(in srgb, var(--tint) 34%, transparent) 0%,
      color-mix(in srgb, var(--tint) 20%, transparent) calc(var(--p) * 0.55),
      color-mix(in srgb, var(--tint) 7%, transparent) calc(var(--p) * 0.9),
      transparent var(--p));
    transition: background 0.9s linear;
    pointer-events: none;
  }
  .paused .prog { filter: saturate(0.12); }
  .quiet .prog { filter: saturate(0.45); }
  .quiet .head .g { color: var(--secondary); }

  /* ── 내용 ── */
  .inner {
    position: relative;
    z-index: 2;
    padding: 0.875rem 1.125rem;
    display: grid;
    gap: 0.25rem;
    align-content: space-between;
    min-height: 0;
  }
  .head {
    display: flex; align-items: center; gap: 0.375rem;
    font-size: 0.6875rem; font-weight: 620;
    letter-spacing: -0.005em;
    color: var(--secondary);
    line-height: 1;
    min-width: 0;
  }
  .head .g { width: 0.8125rem; height: 0.8125rem; flex: none; color: var(--tint); }
  /* 이모지 마크는 font-size로 크기가 정해진다 — 각 문맥의 아이콘 크기에 맞춘다 */
  .g.emoji { display: inline-grid; place-items: center; line-height: 1; }
  .head .g.emoji { font-size: 0.75rem; }
  .chip .g.emoji { font-size: 0.5625rem; }
  .sheet .row .g.emoji { font-size: 0.8125rem; }
  .r-micro .head .g.emoji { font-size: 1rem; }
  .r-wide .head .g.emoji { font-size: 0.9rem; }
  .primary .g.emoji, .primary span.emoji { font-size: 0.75rem; }
  .head .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .head .sp { flex: 1; }
  /* 라벨바 — 곧 함께 올 알림들이 옆으로 붙는다 */
  .head .tags { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
  .head .tag { display: flex; align-items: center; gap: 0.25rem; min-width: 0; }
  .head .tag.imminent .nm { color: var(--label); }
  .head .tag.more { color: var(--tertiary); flex: none; }
  /* 좁은 크기대에서 이름을 다 넣으면 전부 잘리므로 추가 알림은 글리프만 보여준다 */
  .r-base .head .tag:not(:first-child) .nm,
  .r-tall .head .tag:not(:first-child) .nm { display: none; }

  /* 방해 금지 이유 — 자리가 넉넉한 크기대에서만 덧붙인다 */
  .head .tag.why { display: none; color: var(--tertiary); font-weight: 500; }
  .head .tag.why::before { content: "·"; margin-right: 0.25rem; }
  .r-wide .head .tag.why,
  .r-large .head .tag.why { display: flex; }
  .r-wide .head .tag.why .nm,
  .r-large .head .tag.why .nm { display: block; }
  .head .ct { color: var(--tertiary); font-weight: 500; white-space: nowrap; }
  .head .ct b { color: color-mix(in srgb, var(--tint) 80%, white); font-weight: 700; }
  .paused .head .g { color: var(--tertiary); }

  .time {
    font-size: 2.5rem;
    font-weight: 275;
    letter-spacing: -0.05em;
    color: var(--label);
    font-variant-numeric: tabular-nums;
    line-height: 0.94;
    white-space: nowrap;
  }
  .paused .time { color: var(--secondary); }

  .chips { display: flex; gap: 0.25rem; flex-wrap: nowrap; overflow: hidden; }
  .chip {
    display: flex; align-items: center; gap: 0.1875rem;
    font-size: 0.625rem; font-weight: 620;
    padding: 0.1875rem 0.4375rem;
    border-radius: 999px;
    background: var(--fill);
    color: var(--tertiary);
    white-space: nowrap;
  }
  .chip .g { width: 0.625rem; height: 0.625rem; flex: none; }
  .chip.on {
    background: color-mix(in srgb, var(--tint) 22%, transparent);
    color: color-mix(in srgb, var(--tint) 86%, white);
  }

  .week { display: flex; align-items: flex-end; gap: 0.1875rem; height: 1.125rem; }
  .week i { flex: 1; background: var(--fill); border-radius: 0.125rem 0.125rem 0 0; min-height: 0.125rem; }
  .week i.hi { background: color-mix(in srgb, var(--tint) 70%, transparent); }

  /* ── 크기대별 레이아웃 ──────────────────────────────
     폭 변화에 반응하지 않던 문제를 크기대 전환으로 해결한다. */

  /* 기본: 캡션 위 / 숫자 아래 */
  .r-base .inner { grid-template-areas: "head" "time"; }
  .r-base .head { grid-area: head; }
  .r-base .time { grid-area: time; }
  .r-base .chips, .r-base .week { display: none; }

  /* 초소형: 캡션 텍스트 버리고 글리프 + 숫자만 한 줄 */
  .r-micro .inner {
    grid-template-areas: "g time";
    grid-template-columns: auto 1fr;
    align-items: center;
    align-content: center;
    gap: 0.5rem;
    padding: 0.5rem 0.75rem;
  }
  .r-micro .head { grid-area: g; }
  .r-micro .head .nm, .r-micro .head .sp, .r-micro .head .ct { display: none; }
  .r-micro .head .g { width: 1.125rem; height: 1.125rem; }
  .r-micro .time { grid-area: time; font-size: 1.875rem; text-align: right; }
  .r-micro .chips, .r-micro .week { display: none; }

  /* 넓고 낮음: 한 줄로 좌우 배치 — 가운데 빈 공간이 생기지 않게 */
  .r-wide .inner {
    grid-template-areas: "head time";
    grid-template-columns: 1fr auto;
    align-items: center;
    align-content: center;
    gap: 1rem;
    padding: 0.75rem 1.25rem;
  }
  .r-wide .head { grid-area: head; font-size: 0.8125rem; }
  .r-wide .head .g { width: 1rem; height: 1rem; }
  .r-wide .time { grid-area: time; font-size: 2.625rem; }
  .r-wide .chips, .r-wide .week { display: none; }

  /* 좁고 높음: 중앙 정렬 세로 스택 + 다음 차례 칩 */
  .r-tall .inner {
    grid-template-areas: "head" "time" "chips";
    justify-items: center;
    text-align: center;
    align-content: space-evenly;
    padding: 1rem 0.875rem;
  }
  .r-tall .head { grid-area: head; }
  /* 좁은 폭에서 이름과 횟수가 붙어 뭉치므로 횟수는 칩에 양보 */
  .r-tall .head .sp, .r-tall .head .ct { display: none; }
  .r-tall .time { grid-area: time; font-size: 2.625rem; }
  .r-tall .chips { grid-area: chips; display: flex; flex-wrap: wrap; justify-content: center; }
  .r-tall .week { display: none; }

  /* 대형: 숫자 + 칩 + 주간 리듬까지 */
  .r-large .inner {
    grid-template-areas: "head" "time" "chips" "week";
    grid-template-rows: auto 1fr auto auto;
    gap: 0.375rem;
    padding: 0.875rem 1.125rem;
  }
  .r-large .head { grid-area: head; font-size: 0.75rem; }
  .r-large .time { grid-area: time; font-size: 2.5rem; align-self: center; }
  .r-large .chips { grid-area: chips; }
  .r-large .week { grid-area: week; }

  /* ── 예정된 알림 시트 (카드 클릭 시) ── */
  .sheet {
    position: absolute; inset: 0;
    z-index: 3;
    /* 배경은 카드의 scrim이 이미 담당한다. 여기에 또 깔면 뒤 내용이 겹쳐 보인다 —
       대신 열릴 때 .inner를 페이드아웃시킨다. */
    display: flex; flex-direction: column;
    padding: 0.75rem 0.875rem;
    gap: 0.3125rem;
    opacity: 0;
    transform: translateY(6%);
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.22s cubic-bezier(0.32, 0.72, 0, 1);
    overflow: hidden;
  }
  .card.open .sheet { opacity: 1; transform: none; pointer-events: auto; }

  /* ── 달력 ──────────────────────────────────────────
     별도 창으로 띄우면 창 관리가 하나 더 늘고 UI도 따로 논다.
     카드 아래쪽에 붙여 위젯이 길어지는 방식으로 둔다. */
  .cal {
    display: none; flex-direction: column;
    gap: 0.25rem;
    padding: 0 0.75rem 0.625rem;
    min-height: 0;
  }
  .card.calon .cal { display: flex; }
  /* 카드는 grid다 — 위쪽(타이머)은 제 높이만, 남는 높이는 달력이 갖는다.
     flex 속성을 써 봐야 grid 자식에겐 아무 효력이 없다. */
  .card.calon { grid-template-rows: min-content 1fr; }
  .calnav { display: flex; align-items: center; gap: 0.25rem; }
  .calnav .cttl {
    flex: 1; font-size: 0.75rem; font-weight: 650; color: var(--label);
    font-variant-numeric: tabular-nums;
  }
  .calnav button {
    all: unset; cursor: default;
    width: 1.125rem; height: 1.125rem; border-radius: 0.3125rem;
    display: grid; place-items: center;
    color: var(--secondary); font-size: 0.8125rem; line-height: 1;
  }
  .calnav button:hover { background: var(--fill); color: var(--label); }
  .segs { display: flex; gap: 0.125rem; background: var(--fill); border-radius: 0.375rem; padding: 0.0625rem; }
  .segs .seg {
    width: auto; padding: 0 0.3125rem; height: 1rem;
    font-size: 0.625rem; font-weight: 600; border-radius: 0.3125rem;
  }
  .segs .seg.on { background: var(--fill-hi); color: var(--label); }

  .calwd { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.0625rem; }
  .calwd span { font-size: 0.5625rem; color: var(--tertiary); text-align: center; }
  .calwd span:first-child { color: var(--sun); }

  .calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.0625rem; }
  .cday {
    aspect-ratio: 1 / 1;
    border-radius: 0.3125rem;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.09375rem;
    font-size: 0.625rem; color: var(--label);
    cursor: default;
  }
  .cday:hover { background: var(--fill); }
  .cday.out { color: var(--tertiary); }
  .cday.sun { color: var(--sun); }
  .cday.today { box-shadow: inset 0 0 0 1px var(--tint); font-weight: 700; }
  .cday.on { background: var(--tint); color: #06231d; font-weight: 700; }
  .cdots { display: flex; gap: 0.0625rem; height: 0.1875rem; }
  .cdots i { width: 0.1875rem; height: 0.1875rem; border-radius: 50%; background: var(--tint); }
  .cday.on .cdots i { background: #06231d; }

  .callist { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 0.125rem; }
  .callist::-webkit-scrollbar { width: 3px; }
  .callist::-webkit-scrollbar-thumb {
    background: transparent; border-radius: 2px; transition: background 0.15s;
  }
  .callist:hover::-webkit-scrollbar-thumb { background: var(--fill-hi); }
  .cev {
    display: grid; grid-template-columns: 2.25rem 1fr; gap: 0.375rem;
    align-items: baseline; font-size: 0.625rem;
    padding: 0.125rem 0.1875rem; border-radius: 0.25rem;
  }
  .cev:hover { background: var(--fill); }
  .cev .tm { color: var(--secondary); font-variant-numeric: tabular-nums; }
  .cev .nm { color: var(--label); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .calempty { font-size: 0.625rem; color: var(--tertiary); padding: 0.1875rem; }
  .inner { transition: opacity 0.16s ease; }
  .card.open .inner { opacity: 0; pointer-events: none; }
  .sheet .sh {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 0.625rem; font-weight: 650; letter-spacing: 0.02em;
    color: var(--tertiary);
    padding: 0 0.125rem 0.125rem;
    flex: none;
  }
  .sheet .sh button {
    all: unset; cursor: default;
    font-family: inherit; font-size: 0.625rem; font-weight: 650;
    color: color-mix(in srgb, var(--tint) 85%, white);
  }
  .sheet .sh button:hover { text-decoration: underline; }
  .sheet .rows { display: flex; flex-direction: column; gap: 0.1875rem; overflow-y: auto; min-height: 0; }
  #sheet-rows { flex: 1; }   /* 남는 높이는 알림 목록이 갖고, 일정은 제 몫만 */
  .sheet .rows::-webkit-scrollbar { width: 3px; }
  .sheet .rows::-webkit-scrollbar-thumb {
    background: transparent; border-radius: 2px; transition: background 0.15s;
  }
  .sheet .rows:hover::-webkit-scrollbar-thumb { background: var(--fill-hi); }
  .sheet .row {
    display: grid; grid-template-columns: 0.875rem 1fr auto;
    align-items: center; gap: 0.4375rem;
    padding: 0.25rem 0.3125rem;
    margin: 0 -0.1875rem;
    border-radius: 0.375rem;
    font-size: 0.6875rem;
    transition: background 0.1s;
  }
  .sheet .row:hover { background: var(--fill); }

  /* 오늘 일정 — 알림 목록 아래에 얇게 붙인다 */
  /* 오늘 일정은 아래에 붙되, 위쪽 알림 목록을 밀어내지 않도록 제 몫만 차지한다 */
  .sched {
    display: none; flex: none;
    margin-top: 0.375rem; padding-top: 0.375rem;
    border-top: 0.5px solid var(--hairline);
  }
  .sched .sh { margin-bottom: 0.1875rem; }
  .sched .rows { max-height: 5.25rem; }
  .sheet .row.ev { grid-template-columns: 0.375rem 1fr auto; }
  .evdot {
    width: 0.3125rem; height: 0.3125rem; border-radius: 50%;
    background: var(--tertiary); justify-self: center;
  }
  .sheet .row.ev.now .evdot { background: var(--tint); }
  .sheet .row.ev.now .nm { color: var(--label); font-weight: 600; }
  .sheet .row .g { width: 0.875rem; height: 0.875rem; }
  .sheet .row .nm { color: var(--label); font-weight: 540; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet .row .tm { color: var(--secondary); font-variant-numeric: tabular-nums; font-weight: 560; }
  .sheet .row.next .tm { color: color-mix(in srgb, var(--tint) 88%, white); }
  .sheet .empty { font-size: 0.6875rem; color: var(--tertiary); padding: 0.375rem 0.125rem; }

  /* ── 호버 컨트롤 ──
     카드 안이 아니라 카드 아래 예약된 띠에 띄운다 — 메인 내용을 가리지 않는다. */
  .ctlwrap {
    position: absolute;
    left: 0; right: 0; top: 100%;
    height: var(--ctlh);
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transform: translateY(-5px);
    pointer-events: none;
    transition: opacity 0.16s ease, transform 0.2s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .stage:hover .ctlwrap { opacity: 1; transform: none; pointer-events: auto; }

  .controls {
    display: flex; align-items: center; gap: 0.375rem;
    padding: 0.3125rem;
    border-radius: 999px;
    background: var(--bar);
    box-shadow:
      inset 0 0 0 0.5px var(--hairline),
      0 4px 12px rgba(0, 0, 0, 0.40);
  }
  .controls button {
    all: unset;
    cursor: default;
    display: grid; place-items: center;
    width: 1.75rem; height: 1.75rem;
    border-radius: 50%;
    background: var(--fill);
    color: var(--label);
    transition: background 0.12s;
  }
  .controls button:hover { background: var(--fill-hi); }
  .controls button.primary {
    width: auto; padding: 0 0.6875rem; border-radius: 999px;
    grid-auto-flow: column; gap: 0.25rem;
    background: color-mix(in srgb, var(--tint) 82%, black);
    color: #fff;
  }
  .controls button.primary:hover { filter: brightness(1.12); }
  .controls button.primary span { font-family: inherit; font-size: 0.6875rem; font-weight: 650; letter-spacing: -0.01em; }
  .controls svg { width: 0.8125rem; height: 0.8125rem; display: block; }
  .controls button:focus-visible { box-shadow: 0 0 0 2px color-mix(in srgb, var(--tint) 70%, transparent); }

  /* ── 업데이트 알림 칩 ──
     카드 우측 상단 구석에 조용히 뜬다. 한 번 누르면 확인, 한 번 더 누르면 설치. */
  .upchip {
    all: unset;
    cursor: default;
    position: absolute;
    top: 0.5rem; right: 0.5rem;
    z-index: 8;
    display: none;
    align-items: center;
    gap: 0.25rem;
    font-family: inherit;
    font-size: 0.625rem;
    font-weight: 650;
    letter-spacing: -0.01em;
    color: color-mix(in srgb, var(--tint) 90%, white);
    background: color-mix(in srgb, var(--tint) 22%, transparent);
    box-shadow: inset 0 0 0 0.5px color-mix(in srgb, var(--tint) 45%, transparent);
    padding: 0.1875rem 0.4375rem;
    border-radius: 999px;
    max-width: calc(100% - 1rem);
    white-space: nowrap;
    animation: upfade 0.4s ease both;
  }
  .card.has-update .upchip { display: inline-flex; }
  /* 칩이 뜨면 같은 자리의 오늘 횟수는 양보한다 */
  .card.has-update .head .ct { display: none; }
  .upchip svg { width: 0.625rem; height: 0.625rem; flex: none; }
  .upchip:hover { background: color-mix(in srgb, var(--tint) 34%, transparent); }
  .upchip.armed {
    color: #fff;
    background: color-mix(in srgb, var(--tint) 88%, black);
    box-shadow: none;
  }
  @keyframes upfade { from { opacity: 0; transform: translateY(-3px); } }

  /* ── 리사이즈 그립 ── */
  .grip {
    position: absolute; right: 0; bottom: 0;
    width: 0.9375rem; height: 0.9375rem;
    /* 표시 전용 — 실제 드래그는 아래 .rz(리사이즈 존)가 받는다 */
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 6;
  }

  /* 가장자리·모서리 리사이즈 존.
     OS 네이티브 리사이즈는 이 창(투명·프레임 없음)에서 저 혼자 커지는 버그가 있어
     쓰지 않는다. 카드 테두리 위에 걸치게 두어 조준하기 쉽게 한다. */
  .rz { position: absolute; z-index: 8; }
  .rz-n { left: 12px; right: 12px; top: -5px; height: 10px; cursor: ns-resize; }
  .rz-s { left: 12px; right: 12px; bottom: -5px; height: 10px; cursor: ns-resize; }
  .rz-w { top: 12px; bottom: 12px; left: -5px; width: 10px; cursor: ew-resize; }
  .rz-e { top: 12px; bottom: 12px; right: -5px; width: 10px; cursor: ew-resize; }
  .rz-nw { left: -5px; top: -5px; width: 17px; height: 17px; cursor: nwse-resize; }
  .rz-ne { right: -5px; top: -5px; width: 17px; height: 17px; cursor: nesw-resize; }
  .rz-sw { left: -5px; bottom: -5px; width: 17px; height: 17px; cursor: nesw-resize; }
  .rz-se { right: -5px; bottom: -5px; width: 17px; height: 17px; cursor: nwse-resize; }
  .stage:hover .grip { opacity: 0.45; }
  .grip svg { width: 100%; height: 100%; color: var(--label); }

  @media (prefers-reduced-motion: reduce) {
    .prog, .controls { transition: none; }
  }
</style>
</head>
<body>
 <div class="stage" id="stage">
  <div class="card r-base" id="card">
    <div class="prog" id="prog"></div>

    <div class="inner">
      <div class="head">
        <span class="tags" id="tags"></span>
        <span class="sp"></span>
        <span class="ct" id="count"></span>
      </div>
      <div class="time" id="time">--:--</div>
      <div class="chips" id="chips"></div>
      <div class="week" id="week"></div>
    </div>

    <div class="sheet" id="sheet">
      <div class="sh"><span>예정된 알림</span><button id="sheet-stats">기록 보기</button></div>
      <div class="rows" id="sheet-rows"></div>
      <div class="sched" id="sched">
        <div class="sh"><span>오늘 일정</span><button id="sheet-cal">달력</button></div>
        <div class="rows" id="sched-rows"></div>
      </div>
    </div>

    <!-- 달력 — 별도 창이 아니라 카드 안에서 아래로 늘어난다 -->
    <div class="cal" id="cal">
      <div class="calnav">
        <button id="cal-prev" title="이전">‹</button>
        <span class="cttl" id="cal-ttl"></span>
        <button id="cal-next" title="다음">›</button>
        <span class="segs">
          <button id="cal-week" class="seg">주</button>
          <button id="cal-month" class="seg on">월</button>
        </span>
      </div>
      <div class="calwd">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div class="calgrid" id="cal-grid"></div>
      <div class="callist" id="cal-list"></div>
    </div>

    <button class="upchip" id="upchip" title="업데이트 설치"></button>

    <div class="grip" id="grip" title="드래그해서 크기 조절">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <path d="M13 6.5 6.5 13M13 11l-2 2"/>
      </svg>
    </div>
  </div>

  <!-- 가장자리·모서리 리사이즈 존 (카드 테두리 위에 걸침) -->
  <div class="rz rz-n" data-dir="n"></div>
  <div class="rz rz-s" data-dir="s"></div>
  <div class="rz rz-w" data-dir="w"></div>
  <div class="rz rz-e" data-dir="e"></div>
  <div class="rz rz-nw" data-dir="nw"></div>
  <div class="rz rz-ne" data-dir="ne"></div>
  <div class="rz rz-sw" data-dir="sw"></div>
  <div class="rz rz-se" data-dir="se"></div>

  <div class="ctlwrap">
    <div class="controls">
      <button id="btn-now" class="primary" title="지금 알림 실행"><span>지금 쉬기</span></button>
      <button id="btn-pause" title="일시정지 / 재개"></button>
      <button id="btn-cal" title="달력 보이기 / 숨기기"></button>
      <button id="btn-set" title="설정"></button>
      <button id="btn-hide" title="위젯 숨기기"></button>
    </div>
  </div>
 </div>

<script>
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;
  const params = new URLSearchParams(location.search);

  root.dataset.theme = params.get('theme') === 'light' ? 'light' : 'dark';
  const num = (key, fallback) => {
    const v = parseFloat(params.get(key));
    return Number.isNaN(v) ? fallback : v;
  };

  const INSET = num('inset', 12);
  const CTLH = num('ctlh', 36);
  root.style.setProperty('--inset', INSET + 'px');
  root.style.setProperty('--ctlh', CTLH + 'px');
  root.style.setProperty('--scrim-a', String(num('scrim', 0.92)));
  root.style.setProperty('--r', num('radius', 26) + 'px');

  window.nunsseom.onScrim((v) => root.style.setProperty('--scrim-a', String(v)));
  window.nunsseom.onRadius((v) => root.style.setProperty('--r', v + 'px'));

  // ── 크기대 판정 + 스케일 ───────────────────────────
  // 폭·높이 중 더 제약적인 쪽에 맞춰 스케일하고(핵심 수정), 크기대별로 레이아웃을 바꾼다.
  const BASE = { w: 244, h: 110 };
  const REGIMES = ['r-micro', 'r-base', 'r-wide', 'r-tall', 'r-large'];

  function regimeFor(w, h) {
    const aspect = w / h;
    if (h < 96 || w < 200) return 'r-micro';
    if (w >= 320 && h >= 150) return 'r-large';
    if (aspect <= 1.45) return 'r-tall';
    if (aspect >= 2.7) return 'r-wide';
    return 'r-base';
  }

  // ── 이벤트 기록 (트레이에서 켤 때만) ────────────────
  // 창 크기 / 창 이동 / UI 스케일은 서로 다른 경로라, 한 줄로 같이 찍어야 구분된다.
  let dbg = false;
  const dlog = (src, msg) => { if (dbg) window.nunsseom.debugLog(src, msg); };
  let rawHooked = false;
  window.nunsseom.onDebugMode?.((on) => {
    dbg = on;
    if (!on) return;
    dlog('위젯', `기록 시작 · 창 안쪽 ${window.innerWidth}x${window.innerHeight}`
      + ` · rem ${getComputedStyle(root).fontSize} · dpr ${window.devicePixelRatio}`);
    if (rawHooked) return;
    rawHooked = true;
    // 어느 요소를 눌렀든 남긴다 — 카드/존 핸들러가 아예 안 걸리는 경우를 보려면 필요하다
    const name = (el) => {
      if (!el || !el.tagName) return '?';
      const c = String((el.className && (el.className.baseVal ?? el.className)) || '').trim().split(/\s+/)[0];
      return el.tagName.toLowerCase() + (el.id ? '#' + el.id : '') + (c ? '.' + c : '');
    };
    for (const t of ['pointerdown', 'pointerup', 'pointercancel', 'lostpointercapture']) {
      document.addEventListener(t, (e) => {
        dlog('입력', `${t} 대상 ${name(e.target)} · 창안 ${Math.round(e.clientX)},${Math.round(e.clientY)}`
          + ` · 화면 ${e.screenX},${e.screenY} · 버튼 ${e.button}`);
      }, true);
    }
  });

  function layout() {
    // 크기대 판정은 창이 아니라 실제 카드 크기(여백·컨트롤 띠 제외) 기준
    const w = window.innerWidth - INSET * 2;
    const h = window.innerHeight - INSET * 2 - CTLH;
    // 상한을 낮게 잡는다 — 커진 공간은 글자를 2배로 키우는 데 쓰는 게 아니라
    // 내용(칩·주간 리듬)을 더 보여주는 데 쓴다. 애플 위젯 패밀리와 같은 원칙.
    const scale = Math.min(Math.max(Math.min(w / BASE.w, h / BASE.h), 0.72), 1.3);
    root.style.fontSize = (16 * scale).toFixed(3) + 'px';

    const r = regimeFor(w, h);
    const card = $('card');
    for (const c of REGIMES) card.classList.toggle(c, c === r);
    // "UI가 커졌다"가 창 때문인지 스케일 때문인지 구분하려면 둘을 같이 봐야 한다
    dlog('UI', `창안쪽 ${window.innerWidth}x${window.innerHeight}`
      + ` · 카드 ${Math.round(w)}x${Math.round(h)} · 스케일 ${scale.toFixed(3)} · 크기대 ${r}`);
  }
  layout();
  window.addEventListener('resize', layout);

  // 발동 30초 전부터는 그 알림도 라벨바에 올린다
  const IMMINENT_SEC = 30;
  const MAX_TAGS = 3;

  // ── 아이콘 주입 ────────────────────────────────────
  function setGlyph(host, name, cls) {
    host.textContent = '';
    host.append(window.nunsIcon(name, cls));
  }
  setGlyph($('btn-set'), 'gear');
  setGlyph($('btn-hide'), 'minus');
  $('btn-now').prepend(window.nunsIcon('eye'));

  let pauseState = null;
  function setPauseIcon(paused) {
    if (pauseState === paused) return;
    pauseState = paused;
    $('btn-pause').textContent = '';
    $('btn-pause').append(paused ? window.nunsIconFilled('play') : window.nunsIcon('pause'));
  }

  // ── 업데이트 칩 ────────────────────────────────────
  // 실수로 재시작되지 않도록 두 번 누르게 한다.
  // 첫 tick이 동기로 들어올 수 있으므로 tick 핸들러보다 먼저 선언해 둔다.
  const upchip = $('upchip');
  let upVersion = null;
  let upArmed = false;
  let upTimer = null;

  function paintChip(label, armed) {
    upchip.textContent = '';
    upchip.append(window.nunsIcon(armed ? 'check' : 'download'));
    const t = document.createElement('span');
    t.textContent = label;
    upchip.append(t);
    upchip.classList.toggle('armed', armed);
  }

  function showUpdate(info) {
    const card = $('card');
    if (!info || !info.ready) {
      card.classList.remove('has-update');
      upVersion = null;
      return;
    }
    if (upVersion === info.version) return; // 이미 표시 중
    upVersion = info.version;
    upArmed = false;
    paintChip(`업데이트 ${info.version}`, false);
    card.classList.add('has-update');
  }

  upchip.onclick = (e) => {
    e.stopPropagation();
    if (!upArmed) {
      upArmed = true;
      paintChip('설치하고 재시작', true);
      clearTimeout(upTimer);
      upTimer = setTimeout(() => {
        upArmed = false;
        paintChip(`업데이트 ${upVersion}`, false);
      }, 5000);
      return;
    }
    clearTimeout(upTimer);
    paintChip('설치 중…', true);
    window.nunsseom.updateInstall();
  };
  // 칩을 눌러도 카드 클릭(시트 열기)이 따라오지 않게
  upchip.addEventListener('pointerdown', (e) => e.stopPropagation());

  // ── 렌더 ──────────────────────────────────────────
  let lastTypeId = null;

  /**
   * 라벨바를 그린다.
   * 기본은 가장 이른 알림 하나. 여기에 (a) 30초 안에 발동할 것과
   * (b) 다음 휴식에 함께 묶일 것을 옆으로 붙인다.
   */
  function renderTags(d) {
    const host = $('tags');
    host.textContent = '';

    const addTag = (mark, name, color, cls) => {
      const tag = document.createElement('span');
      tag.className = 'tag' + (cls ? ' ' + cls : '');
      if (mark) {
        const g = window.nunsMark(mark, 'g');
        if (color) g.style.color = color;
        tag.append(g);
      }
      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = name;
      tag.append(nm);
      host.append(tag);
      return tag;
    };

    if (d.paused) { addTag(d.type || null, '일시정지됨', null); return; }
    if (d.idle) { addTag(d.type || null, '자리 비움', null); return; }

    // 방해 금지 — 알림이 밀렸는지와 무관하게 켜져 있는 동안 계속 알린다.
    // 이유(발표 모드 / Zoom / 일정 이름)는 넓은 크기에서만 덧붙인다.
    const quiet = d.hold || d.dnd;
    if (quiet) {
      addTag('sleep', d.hold ? '방해 금지 · 대기 중' : '방해 금지', null);
      const why = addTag(null, quiet, null, 'why');
      why.title = quiet;
      return;
    }

    addTag(d.type, d.type.name, d.type.color,
      d.remaining <= IMMINENT_SEC ? 'imminent' : null);

    const bundle = new Set(d.bundle || []);
    const extras = (d.upcoming || []).filter((t) =>
      t.id !== d.type.id && (t.remaining <= IMMINENT_SEC || bundle.has(t.id)));

    for (const t of extras.slice(0, MAX_TAGS - 1)) {
      addTag(t, t.name, t.color, t.remaining <= IMMINENT_SEC ? 'imminent' : null);
    }
    const hidden = extras.length - (MAX_TAGS - 1);
    if (hidden > 0) addTag(null, `+${hidden}`, null, 'more');
  }

  /** 남은 시간을 사람이 읽는 형태로 */
  function fmtLeft(sec) {
    if (sec >= 3600) {
      const h = Math.floor(sec / 3600);
      const m = Math.round((sec % 3600) / 60);
      return m ? `${h}시간 ${m}분` : `${h}시간`;
    }
    if (sec >= 60) return `${Math.floor(sec / 60)}분 ${String(sec % 60).padStart(2, '0')}초`;
    return `${sec}초`;
  }

  function renderSheet(list) {
    const host = $('sheet-rows');
    host.textContent = '';
    if (!list || !list.length) {
      const p = document.createElement('div');
      p.className = 'empty';
      p.textContent = '켜진 알림이 없어요';
      host.append(p);
      return;
    }
    list.forEach((t, i) => {
      const row = document.createElement('div');
      row.className = 'row' + (i === 0 ? ' next' : '');
      const g = window.nunsMark(t, 'g');
      g.style.color = t.color;
      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = t.name;
      const tm = document.createElement('span');
      tm.className = 'tm';
      tm.textContent = fmtLeft(t.remaining || 0);
      row.append(g, nm, tm);
      // 항목을 누르면 그 종류의 기록 상세로
      row.style.cursor = 'default';
      row.onclick = (e) => { e.stopPropagation(); window.nunsseom.openStats(t.id); };
      host.append(row);
    });
  }

  // ── 오늘 일정 ──────────────────────────────────────
  // 캘린더를 읽어놓고 음소거에만 쓰던 걸, 시트에서 눈으로도 보게 한다.
  const hhmm = (ms) => {
    const d = new Date(ms);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  };

  function renderSchedule(list) {
    const host = $('sched-rows');
    const sec = $('sched');
    // CSS 기본이 none이라 ''로 비우면 도로 숨는다 — 명시적으로 켠다
    if (!list || !list.length) { sec.style.display = 'none'; return; }
    sec.style.display = 'block';
    host.textContent = '';
    // 끝난 일정은 하나까지만 남기고 접는다 — 남은 하루가 먼저 보여야 한다
    const rest = list.filter((e) => !e.done);
    const show = rest.length ? rest : list.slice(-1);
    for (const e of show.slice(0, 6)) {
      const row = document.createElement('div');
      row.className = 'row ev' + (e.now ? ' now' : '');
      const dot = document.createElement('span');
      dot.className = 'evdot';
      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = e.summary;
      const tm = document.createElement('span');
      tm.className = 'tm';
      tm.textContent = e.allDay ? '종일' : hhmm(e.start);
      row.append(dot, nm, tm);
      host.append(row);
    }
  }

  function renderChips(list, bundleIds) {
    const host = $('chips');
    host.textContent = '';
    const bundled = new Set(bundleIds || []);
    for (const t of list.slice(0, 4)) {
      const chip = document.createElement('span');
      chip.className = 'chip' + (bundled.has(t.id) ? ' on' : '');
      chip.append(window.nunsMark(t, 'g'));
      const label = document.createElement('span');
      label.textContent = t.name;
      chip.append(label);
      host.append(chip);
    }
  }

  function renderWeek(days) {
    const host = $('week');
    host.textContent = '';
    const max = Math.max(1, ...days);
    days.forEach((v, i) => {
      const bar = document.createElement('i');
      bar.style.height = Math.max(8, (v / max) * 100) + '%';
      if (i === days.length - 1) bar.className = 'hi';
      host.append(bar);
    });
  }

  window.nunsseom.onTick((d) => {
    const card = $('card');

    if (d.empty) {
      card.classList.add('paused');
      $('time').textContent = '--:--';
      $('tags').textContent = '켜진 알림 없음';
      $('count').textContent = '';
      root.style.setProperty('--p', '0%');
      setPauseIcon(!!d.paused);
      renderSheet([]);
      renderSchedule(d.schedule);
      return;
    }

    const m = Math.floor(d.remaining / 60);
    const s = d.remaining % 60;
    $('time').textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

    const pct = Math.max(0, Math.min(100, (1 - d.remaining / d.total) * 100));
    root.style.setProperty('--p', pct.toFixed(2) + '%');
    root.style.setProperty('--tint', d.type.color);

    if (d.type.id !== lastTypeId) {
      lastTypeId = d.type.id;
      $('btn-now').firstChild.replaceWith(window.nunsMark(d.type));
    }
    renderTags(d);

    const ct = $('count');
    ct.textContent = '';
    ct.append('오늘 ');
    const b = document.createElement('b');
    b.textContent = String(d.today.done);
    ct.append(b, '회');

    // 방해 금지는 완전히 멈춘 상태가 아니므로 paused보다 약하게 표시한다
    card.classList.toggle('paused', d.paused || d.idle || !!d.hold);
    card.classList.toggle('quiet', !d.paused && !d.idle && !d.hold && !!d.dnd);
    setPauseIcon(d.paused);

    if (d.upcoming) {
      renderChips(d.upcoming, d.bundle && d.bundle.length ? d.bundle : [d.type.id]);
      renderSheet(d.upcoming);
    }
    renderSchedule(d.schedule);
    showUpdate(d.update);
    if (d.week) renderWeek(d.week);
  });

  $('btn-pause').onclick = () => window.nunsseom.togglePause();
  $('btn-now').onclick = () => window.nunsseom.breakNow(lastTypeId);
  $('btn-set').onclick = () => window.nunsseom.openSettings();
  $('sheet-stats').onclick = (e) => { e.stopPropagation(); window.nunsseom.openStats(null); };
  $('sheet-cal').onclick = (e) => { e.stopPropagation(); toggleCal(true); };

  // ── 달력 ────────────────────────────────────────────
  // 카드 안에서 아래로 늘어난다. 별도 창이 아니라 위젯이 길어지는 방식.
  const calEl = $('cal');
  const calCard = $('card');
  let calMode = 'month';                     // 'month' | 'week'
  let calAnchor = new Date();                // 보고 있는 달/주의 기준 날짜
  let calSel = dayKey(new Date());
  let calData = null;

  function dayKey(d) { return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }
  function fromKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
  const hh = (ms) => {
    const d = new Date(ms);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  };

  function eventsOn(d) {
    if (!calData) return [];
    const from = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    const to = from + 86400000;
    return calData.events
      .filter((e) => e.start < to && e.end > from)
      .sort((a, b) => (a.allDay === b.allDay ? a.start - b.start : a.allDay ? -1 : 1));
  }

  async function loadCal() {
    // 일정을 못 받아와도 격자는 그린다 — 빈 달력이 아무것도 없는 것보다 낫다
    try {
      calData = await window.nunsseom.calMonth(calAnchor.getFullYear(), calAnchor.getMonth());
    } catch {
      calData = { events: [], hasCalendar: false };
    }
    paintCal();
  }

  function paintCal() {
    const grid = $('cal-grid');
    grid.textContent = '';
    const todayK = dayKey(new Date());

    let cells = [];
    if (calMode === 'week') {
      const s = new Date(calAnchor);
      s.setDate(s.getDate() - s.getDay());
      for (let i = 0; i < 7; i++) cells.push(new Date(s.getFullYear(), s.getMonth(), s.getDate() + i));
      $('cal-ttl').textContent =
        `${cells[0].getMonth() + 1}월 ${cells[0].getDate()}일 – ${cells[6].getMonth() + 1}월 ${cells[6].getDate()}일`;
    } else {
      const y = calAnchor.getFullYear(), m = calAnchor.getMonth();
      const lead = new Date(y, m, 1).getDay();
      const days = new Date(y, m + 1, 0).getDate();
      const total = Math.ceil((lead + days) / 7) * 7;
      for (let i = 0; i < total; i++) cells.push(new Date(y, m, i - lead + 1));
      $('cal-ttl').textContent = `${y}년 ${m + 1}월`;
    }

    for (const d of cells) {
      const out = calMode === 'month' && d.getMonth() !== calAnchor.getMonth();
      const cell = document.createElement('div');
      cell.className = 'cday' + (out ? ' out' : '') + (d.getDay() === 0 ? ' sun' : '')
        + (dayKey(d) === todayK ? ' today' : '') + (dayKey(d) === calSel ? ' on' : '');
      const num = document.createElement('span');
      num.textContent = d.getDate();
      const dots = document.createElement('span');
      dots.className = 'cdots';
      for (let k = 0; k < Math.min(3, eventsOn(d).length); k++) dots.append(document.createElement('i'));
      cell.append(num, dots);
      cell.onclick = (e) => {
        e.stopPropagation();
        calSel = dayKey(d);
        if (out) { calAnchor = new Date(d); loadCal(); return; }
        paintCal();
      };
      // 빈 날짜를 두 번 누르면 그 날 오전 10시로 새 일정 만들기 화면을 연다
      cell.ondblclick = (e) => {
        e.stopPropagation();
        const s = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 10, 0);
        window.nunsseom.calNewEvent({ start: s.getTime(), end: s.getTime() + 3600000 });
      };
      grid.append(cell);
    }

    // 선택한 날의 일정
    const host = $('cal-list');
    host.textContent = '';
    const list = eventsOn(fromKey(calSel));
    if (calData && !calData.hasCalendar) {
      const p = document.createElement('div');
      p.className = 'calempty';
      p.textContent = '설정에서 캘린더를 연결하세요';
      host.append(p);
      return;
    }
    if (!list.length) {
      const p = document.createElement('div');
      p.className = 'calempty';
      p.textContent = '일정 없음';
      host.append(p);
      return;
    }
    for (const e of list) {
      const row = document.createElement('div');
      row.className = 'cev';
      const tm = document.createElement('span');
      tm.className = 'tm';
      tm.textContent = e.allDay ? '종일' : hh(e.start);
      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = e.summary;
      row.append(tm, nm);
      row.title = '두 번 누르면 웹에서 엽니다';
      row.ondblclick = (ev2) => {
        ev2.stopPropagation();
        window.nunsseom.calOpenEvent(e);
      };
      host.append(row);
    }
  }

  function shift(dir) {
    const d = new Date(calAnchor);
    if (calMode === 'week') d.setDate(d.getDate() + dir * 7);
    else d.setMonth(d.getMonth() + dir, 1);
    calAnchor = d;
    loadCal();
  }

  function setMode(mode) {
    calMode = mode;
    $('cal-week').classList.toggle('on', mode === 'week');
    $('cal-month').classList.toggle('on', mode === 'month');
    window.nunsseom.setApp({ calendarMode: mode });
    resizeForCal();
    paintCal();
  }

  /** 달력을 켜고 끌 때 위젯 높이를 그만큼 늘리고 줄인다.
      필요한 높이는 실제로 그려본 뒤 재야 정확하다 (칸이 정사각형이라 폭에 따라 달라진다) */
  function resizeForCal() {
    const on = calCard.classList.contains('calon');
    requestAnimationFrame(() => {
      const needed = on ? Math.ceil(calEl.scrollHeight) : 0;
      window.nunsseom.calPanel({ on, needed });
    });
  }

  function toggleCal(force) {
    const on = force !== undefined ? force : !calCard.classList.contains('calon');
    calCard.classList.toggle('calon', on);
    calCard.classList.remove('open');            // 시트와 동시에 열리면 겹친다
    window.nunsseom.setApp({ calendarPanel: on });
    resizeForCal();
    if (on) loadCal();
  }

  // 지난번에 켜 둔 상태를 이어간다
  if (params.get('calmode') === 'week') {
    calMode = 'week';
    $('cal-week').classList.add('on');
    $('cal-month').classList.remove('on');
  }
  if (params.get('calpanel') === '1') {
    calCard.classList.add('calon');
    loadCal().then(resizeForCal);
  }

  $('btn-cal').append(window.nunsIcon('calendar'));
  $('btn-cal').onclick = () => toggleCal();
  $('cal-prev').onclick = (e) => { e.stopPropagation(); shift(-1); };
  $('cal-next').onclick = (e) => { e.stopPropagation(); shift(1); };
  $('cal-week').onclick = (e) => { e.stopPropagation(); setMode('week'); };
  $('cal-month').onclick = (e) => { e.stopPropagation(); setMode('month'); };
  // 달력 안을 눌러도 카드 이동/시트 토글로 새지 않게
  calEl.addEventListener('pointerdown', (e) => e.stopPropagation());
  window.nunsseom.onCalChanged?.(() => { if (calCard.classList.contains('calon')) loadCal(); });
  window.nunsseom.onCalShow?.(() => toggleCal(true));
  $('btn-hide').onclick = () => window.nunsseom.hideWidget();

  // ── 카드: 클릭하면 예정된 알림 시트, 끌면 창 이동 ──
  // app-region: drag는 OS가 마우스 이벤트를 가져가 클릭을 못 받으므로 직접 구현한다.
  const cardEl = $('card');
  let press = null;
  let dragging = false;

  cardEl.addEventListener('pointerdown', async (e) => {
    if (e.button !== 0) return;
    // 컨트롤·시트 위에서는 카드 이동/토글 로직을 돌리지 않는다.
    // (시트를 포함하지 않으면 카드가 포인터를 가로채 시트 버튼 클릭이 먹힌다)
    if (e.target.closest('.ctlwrap, .sheet')) return;
    // 오른쪽아래 모서리(그립 표시 자리)는 OS 리사이즈 몫이다.
    // 여기서 창을 움직이기 시작하면 리사이즈하려던 손이 창을 끌어버린다.
    const gr = $('grip').getBoundingClientRect();
    if (e.clientX >= gr.left && e.clientY >= gr.top) return;
    dragging = false;
    const pos = await window.nunsseom.getWidgetPos();
    press = { sx: e.screenX, sy: e.screenY, x: pos.x, y: pos.y };
    try { cardEl.setPointerCapture(e.pointerId); } catch {}
    dlog('카드', `down 화면 ${e.screenX},${e.screenY} · 창 @${pos.x},${pos.y}`
      + ` · 대상 ${e.target.tagName}.${e.target.className?.baseVal ?? e.target.className}`);
  });

  // 시트가 열린 상태에서 빈 곳(버튼·행이 아닌 곳)을 누르면 닫는다
  $('sheet').addEventListener('pointerdown', (e) => {
    if (!e.target.closest('#sheet-stats, .rows .row')) {
      cardEl.classList.remove('open');
    }
  });

  cardEl.addEventListener('pointermove', (e) => {
    if (!press) return;
    const dx = e.screenX - press.sx;
    const dy = e.screenY - press.sy;
    if (!dragging && Math.abs(dx) + Math.abs(dy) > 4) { dragging = true; dlog('카드', '이동 시작'); }
    if (dragging) window.nunsseom.moveWidget({ x: press.x + dx, y: press.y + dy });
  });

  const endPress = (e) => {
    if (!press) return;
    const wasDrag = dragging;
    press = null;
    dragging = false;
    try { cardEl.releasePointerCapture(e.pointerId); } catch {}
    if (!wasDrag) cardEl.classList.toggle('open'); // 끌지 않았으면 클릭 = 시트 토글
    dlog('카드', wasDrag ? 'up (이동으로 끝)' : `up → 시트 ${cardEl.classList.contains('open') ? '열림' : '닫힘'}`);
  };
  cardEl.addEventListener('pointerup', endPress);
  cardEl.addEventListener('pointercancel', endPress);

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') cardEl.classList.remove('open');
  });

  // ── 가장자리·모서리 리사이즈 ───────────────────────
  // OS 네이티브 리사이즈는 쓰지 않는다. 투명·프레임 없는 창에서는 버튼을 누른 채
  // 가만히 있어도 창이 저 혼자 최대치까지 자라는 문제가 있다. 여기서 직접 계산한다.
  // 화면 좌표(screenX/Y) 기준이라 창이 움직여도 값이 흔들리지 않는다.
  let rz = null;

  for (const zone of document.querySelectorAll('.rz')) {
    zone.addEventListener('pointerdown', async (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();               // 카드의 이동/토글 로직으로 새지 않게
      try { zone.setPointerCapture(e.pointerId); } catch {}
      const b = await window.nunsseom.getWidgetBounds();
      rz = { dir: zone.dataset.dir, sx: e.screenX, sy: e.screenY, ...b };
      dlog('리사이즈', `down(${rz.dir}) 화면 ${e.screenX},${e.screenY}`
        + ` · 시작 ${b.width}x${b.height} @${b.x},${b.y}`);
    });

    zone.addEventListener('pointermove', (e) => {
      if (!rz) return;
      const dx = e.screenX - rz.sx;
      const dy = e.screenY - rz.sy;
      let { x, y, width, height } = rz;
      if (rz.dir.includes('e')) width = rz.width + dx;
      if (rz.dir.includes('s')) height = rz.height + dy;
      if (rz.dir.includes('w')) { width = rz.width - dx; x = rz.x + dx; }
      if (rz.dir.includes('n')) { height = rz.height - dy; y = rz.y + dy; }
      window.nunsseom.setWidgetBounds({ x, y, width, height, dir: rz.dir });
      dlog('리사이즈', `move(${rz.dir}) 화면 ${e.screenX},${e.screenY} · 이동량 ${dx},${dy}`
        + ` → 요청 ${Math.round(width)}x${Math.round(height)} @${Math.round(x)},${Math.round(y)}`);
    });

    const endRz = (e) => {
      if (!rz) return;
      dlog('리사이즈', `${e.type}(${rz.dir}) 끝`);
      rz = null;
      try { zone.releasePointerCapture(e.pointerId); } catch {}
    };
    zone.addEventListener('pointerup', endRz);
    zone.addEventListener('pointercancel', endRz);
  }
</script>
</body>
</html>
