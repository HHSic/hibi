<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/font/pretendard.css">
<script src="icons.js"></script>
<style>
  /* ── 토큰 ─────────────────────────────────────────────
     블러는 Win11 아크릴이, 틴트는 --scrim이 담당한다.
     모든 치수는 rem이고 루트 폰트크기는 폭·높이 중 더 제약적인 쪽에 맞춰 스케일된다. */
  :root {
    /* 실시간 블러가 없으므로 틴트가 가독성을 담당한다 */
    --scrim-a: 0.92;
    --scrim: rgba(20, 20, 25, var(--scrim-a));
    --inset: 12px;
    --ctlh: 36px;
    --label: rgba(255, 255, 255, 0.96);
    --secondary: rgba(235, 235, 245, 0.60);
    --tertiary: rgba(235, 235, 245, 0.32);
    --fill: rgba(255, 255, 255, 0.13);
    --fill-hi: rgba(255, 255, 255, 0.24);
    --hairline: rgba(255, 255, 255, 0.16);
    --bar: rgba(24, 24, 28, 0.90);
    --sun: #ff8b8b;           /* 달력의 일요일 */
    --tint: #5ecfb6;          /* 다음 알림 종류 색 — JS가 갱신 */
    /* 안 읽은 메일 — 민트(tint)의 반대편 색. 아이콘의 시곗바늘과 같은 계열이라
       이 위젯 안에서 «아직 안 본 것»이 한눈에 튄다. */
    --unread: #f5a623;
    --p: 0%;                  /* 진행률 */
    --r: 0px;                 /* CSS 코너 반경 (투명 창일 때만 사용) */
  }
  :root[data-theme="light"] {
    --scrim: rgba(252, 252, 254, var(--scrim-a));
    --label: rgba(0, 0, 0, 0.90);
    --secondary: rgba(60, 60, 67, 0.62);
    --tertiary: rgba(60, 60, 67, 0.32);
    --fill: rgba(120, 120, 128, 0.18);
    --fill-hi: rgba(120, 120, 128, 0.32);
    --hairline: rgba(255, 255, 255, 0.60);
    --bar: rgba(250, 250, 252, 0.92);
    --sun: #d94a4a;
    --unread: #c76a00;        /* 흰 배경에서는 한 단계 눌러야 읽힌다 */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html { font-size: 16px; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI Variable Display', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    /* 창 안쪽 투명 여백 — 그림자가 드리워지고, 아래쪽엔 컨트롤 띠를 예약한다 */
    padding: var(--inset);
    padding-bottom: calc(var(--inset) + var(--ctlh));
  }

  /* 카드 + 컨트롤 띠를 함께 감싸 hover 판정을 이어준다 */
  .stage { position: relative; width: 100%; height: 100%; }

  .card {
    /* app-region: drag를 쓰면 OS가 마우스 이벤트를 가져가 클릭이 안 잡히므로
       이동은 JS가 직접 처리한다 (아래 포인터 핸들러) */
    cursor: default;
    position: relative;
    width: 100%; height: 100%;
    background: var(--scrim);
    border-radius: var(--r);
    overflow: hidden;
    display: grid;
    box-shadow:
      inset 0 0 0 0.5px var(--hairline),
      0 4px 14px rgba(0, 0, 0, 0.42),
      0 1px 3px rgba(0, 0, 0, 0.28);
  }
  /* 유리 시트 광택 — 위에서 아래로 아주 옅게 */
  .card::before {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(170deg, rgba(255, 255, 255, 0.07) 0%, transparent 42%);
    pointer-events: none;
    z-index: 1;
  }
  /* 상단 하이라이트.
     inset box-shadow로 그리면 라운드 곡선과 만나는 지점에 밝은 점이 뭉치므로,
     양끝을 페이드시킨 1px 라인으로 그린다. */
  .card::after {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 1px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(255, 255, 255, 0.22) 24%,
      rgba(255, 255, 255, 0.22) 76%,
      transparent 100%);
    pointer-events: none;
    z-index: 7;
  }

  /* ── 배경이 프로그레스 (10안) ──
     경계에 선을 두지 않고 부드럽게 사라지게 한다 — 하드 엣지는 얼룩처럼 보인다. */
  .prog {
    position: absolute; inset: 0;
    background: linear-gradient(90deg,
      color-mix(in srgb, var(--tint) 34%, transparent) 0%,
      color-mix(in srgb, var(--tint) 20%, transparent) calc(var(--p) * 0.55),
      color-mix(in srgb, var(--tint) 7%, transparent) calc(var(--p) * 0.9),
      transparent var(--p));
    transition: background 0.9s linear;
    pointer-events: none;
  }
  .paused .prog { filter: saturate(0.12); }
  .quiet .prog { filter: saturate(0.45); }
  .quiet .head .g { color: var(--secondary); }

  /* ── 내용 ── */
  .inner {
    position: relative;
    z-index: 2;
    padding: 0.875rem 1.125rem;
    display: grid;
    gap: 0.25rem;
    align-content: space-between;
    min-height: 0;
  }
  .head {
    display: flex; align-items: center; gap: 0.375rem;
    font-size: 0.6875rem; font-weight: 620;
    letter-spacing: -0.005em;
    color: var(--secondary);
    line-height: 1;
    min-width: 0;
  }
  .head .g { width: 0.8125rem; height: 0.8125rem; flex: none; color: var(--tint); }
  /* 이모지 마크는 font-size로 크기가 정해진다 — 각 문맥의 아이콘 크기에 맞춘다 */
  .g.emoji { display: inline-grid; place-items: center; line-height: 1; }
  .head .g.emoji { font-size: 0.75rem; }
  .chip .g.emoji { font-size: 0.5625rem; }
  .sheet .row .g.emoji { font-size: 0.8125rem; }
  .r-micro .head .g.emoji { font-size: 1rem; }
  .r-wide .head .g.emoji { font-size: 0.9rem; }
  .primary .g.emoji, .primary span.emoji { font-size: 0.75rem; }
  .head .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .head .sp { flex: 1; }
  /* 라벨바 — 곧 함께 올 알림들이 옆으로 붙는다 */
  .head .tags { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
  .head .tag { display: flex; align-items: center; gap: 0.25rem; min-width: 0; }
  .head .tag.imminent .nm { color: var(--label); }
  .head .tag.more { color: var(--tertiary); flex: none; }
  /* 좁은 크기대에서 이름을 다 넣으면 전부 잘리므로 추가 알림은 글리프만 보여준다 */
  .r-base .head .tag:not(:first-child) .nm,
  .r-tall .head .tag:not(:first-child) .nm { display: none; }

  /* 방해 금지 이유 — 자리가 넉넉한 크기대에서만 덧붙인다 */
  .head .tag.why { display: none; color: var(--tertiary); font-weight: 500; }
  .head .tag.why::before { content: "·"; margin-right: 0.25rem; }
  .r-wide .head .tag.why,
  .r-large .head .tag.why { display: flex; }
  .r-wide .head .tag.why .nm,
  .r-large .head .tag.why .nm { display: block; }
  .head .ct { color: var(--tertiary); font-weight: 500; white-space: nowrap; }
  .head .ct b { color: color-mix(in srgb, var(--tint) 80%, white); font-weight: 700; }
  .paused .head .g { color: var(--tertiary); }

  .time {
    font-size: 2.5rem;
    font-weight: 275;
    letter-spacing: -0.05em;
    color: var(--label);
    font-variant-numeric: tabular-nums;
    line-height: 0.94;
    white-space: nowrap;
  }
  .paused .time { color: var(--secondary); }

  .chips { display: flex; gap: 0.25rem; flex-wrap: nowrap; overflow: hidden; }
  .chip {
    display: flex; align-items: center; gap: 0.1875rem;
    font-size: 0.625rem; font-weight: 620;
    padding: 0.1875rem 0.4375rem;
    border-radius: 999px;
    background: var(--fill);
    color: var(--tertiary);
    white-space: nowrap;
  }
  .chip .g { width: 0.625rem; height: 0.625rem; flex: none; }
  .chip.on {
    background: color-mix(in srgb, var(--tint) 22%, transparent);
    color: color-mix(in srgb, var(--tint) 86%, white);
  }

  .week { display: flex; align-items: flex-end; gap: 0.1875rem; height: 1.125rem; }
  .week i { flex: 1; background: var(--fill); border-radius: 0.125rem 0.125rem 0 0; min-height: 0.125rem; }
  .week i.hi { background: color-mix(in srgb, var(--tint) 70%, transparent); }

  /* ── 크기대별 레이아웃 ──────────────────────────────
     폭 변화에 반응하지 않던 문제를 크기대 전환으로 해결한다. */

  /* 기본: 캡션 위 / 숫자 아래 */
  .r-base .inner { grid-template-areas: "head" "time"; }
  .r-base .head { grid-area: head; }
  .r-base .time { grid-area: time; }
  .r-base .chips, .r-base .week { display: none; }

  /* 초소형: 캡션 텍스트 버리고 글리프 + 숫자만 한 줄 */
  .r-micro .inner {
    grid-template-areas: "g time";
    grid-template-columns: auto 1fr;
    align-items: center;
    align-content: center;
    gap: 0.5rem;
    padding: 0.5rem 0.75rem;
  }
  .r-micro .head { grid-area: g; }
  .r-micro .head .nm, .r-micro .head .sp, .r-micro .head .ct { display: none; }
  .r-micro .head .g { width: 1.125rem; height: 1.125rem; }
  .r-micro .time { grid-area: time; font-size: 1.875rem; text-align: right; }
  .r-micro .chips, .r-micro .week { display: none; }

  /* 넓고 낮음: 한 줄로 좌우 배치 — 가운데 빈 공간이 생기지 않게 */
  .r-wide .inner {
    grid-template-areas: "head time";
    grid-template-columns: 1fr auto;
    align-items: center;
    align-content: center;
    gap: 1rem;
    padding: 0.75rem 1.25rem;
  }
  .r-wide .head { grid-area: head; font-size: 0.8125rem; }
  .r-wide .head .g { width: 1rem; height: 1rem; }
  .r-wide .time { grid-area: time; font-size: 2.625rem; }
  .r-wide .chips, .r-wide .week { display: none; }

  /* 좁고 높음: 중앙 정렬 세로 스택 + 다음 차례 칩 */
  .r-tall .inner {
    grid-template-areas: "head" "time" "chips";
    justify-items: center;
    text-align: center;
    align-content: space-evenly;
    padding: 1rem 0.875rem;
  }
  .r-tall .head { grid-area: head; }
  /* 좁은 폭에서 이름과 횟수가 붙어 뭉치므로 횟수는 칩에 양보 */
  .r-tall .head .sp, .r-tall .head .ct { display: none; }
  .r-tall .time { grid-area: time; font-size: 2.625rem; }
  .r-tall .chips { grid-area: chips; display: flex; flex-wrap: wrap; justify-content: center; }
  .r-tall .week { display: none; }

  /* 대형: 숫자 + 칩 + 주간 리듬까지 */
  .r-large .inner {
    grid-template-areas: "head" "time" "chips" "week";
    grid-template-rows: auto 1fr auto auto;
    gap: 0.375rem;
    padding: 0.875rem 1.125rem;
  }
  .r-large .head { grid-area: head; font-size: 0.75rem; }
  .r-large .time { grid-area: time; font-size: 2.5rem; align-self: center; }
  .r-large .chips { grid-area: chips; }
  .r-large .week { grid-area: week; }

  /* ── 예정된 알림 시트 (카드 클릭 시) ── */
  .sheet {
    position: absolute; inset: 0;
    z-index: 3;
    /* 배경은 카드의 scrim이 이미 담당한다. 여기에 또 깔면 뒤 내용이 겹쳐 보인다 —
       대신 열릴 때 .inner를 페이드아웃시킨다. */
    display: flex; flex-direction: column;
    padding: 0.75rem 0.875rem;
    gap: 0.3125rem;
    opacity: 0;
    transform: translateY(6%);
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.22s cubic-bezier(0.32, 0.72, 0, 1);
    overflow: hidden;
  }
  .card.open .sheet { opacity: 1; transform: none; pointer-events: auto; }

  /* ── 달력 ──────────────────────────────────────────
     별도 창으로 띄우면 창 관리가 하나 더 늘고 UI도 따로 논다.
     카드 아래쪽에 붙여 위젯이 길어지는 방식으로 둔다. */
  .cal {
    display: none; flex-direction: column;
    gap: 0.25rem;
    padding: 0 0.75rem 0.625rem;
    min-height: 0;
  }
  .card.calon .cal:not(.mailpanel) { display: flex; }
  .card.mailon .mailpanel { display: flex; }
  .card.mailon:not(.calon) { grid-template-rows: min-content 1fr; }
  /* 카드는 grid다 — 위쪽(타이머)은 제 높이만, 남는 높이는 달력이 갖는다.
     flex 속성을 써 봐야 grid 자식에겐 아무 효력이 없다. */
  .card.calon { grid-template-rows: min-content 1fr; }
  /* 둘 다 켜면 세로가 모자란다.
     행을 안 정해두면 달력이 제 높이를 통째로 가져가고 메일은 «1fr = 남은 것 = 0»이 되어
     머리글만 남은 채 달력 위에 겹쳐 그려진다. 각자 최소 몫을 정하고, 넘치면 안에서 굴린다. */
  .card.mailon.calon {
    grid-template-rows: min-content minmax(3.25rem, 7.5rem) minmax(6rem, 1fr);
  }
  .card.mailon.calon .mailpanel,
  .card.mailon.calon .cal:not(.mailpanel) { min-height: 0; }
  /* 달력은 칸이 정사각형이라 높이를 줄일 수 없다 — 대신 세로로 굴려 아래 주도 볼 수 있게 */
  .card.mailon.calon .cal:not(.mailpanel) { overflow-y: auto; }
  .cal::-webkit-scrollbar { width: 3px; }
  .cal::-webkit-scrollbar-thumb { background: transparent; border-radius: 2px; transition: background 0.15s; }
  .cal:hover::-webkit-scrollbar-thumb { background: var(--fill-hi); }
  .calnav { display: flex; align-items: center; gap: 0.25rem; }
  .calnav .cttl {
    flex: 1; font-size: 0.75rem; font-weight: 650; color: var(--label);
    font-variant-numeric: tabular-nums;
    /* 버튼이 셋이라 좁아진다 — 제목이 두 줄로 접히면 머리글이 통째로 밀린다 */
    min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .calnav button {
    all: unset; cursor: default;
    width: 1.125rem; height: 1.125rem; border-radius: 0.3125rem;
    display: grid; place-items: center;
    color: var(--secondary); font-size: 0.8125rem; line-height: 1;
  }
  .calnav button:hover { background: var(--fill); color: var(--label); }
  /* 글자가 든 버튼은 정사각형 칸에 가둘 수 없다 */
  /* 결과 한 줄 — 메인이 틱으로 보내준다. 화면에서 직접 쓰면 다음 틱이 덮어쓴다. */
  .note {
    flex: 1; min-width: 0; font-size: 0.5625rem; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--secondary);
  }
  .note.good { color: var(--tint); }
  .note.bad { color: var(--sun); }
  .note:empty { display: none; }
  .calnav button.txt {
    width: auto; padding: 0 0.375rem; height: 1rem;
    font-size: 0.625rem; font-weight: 600;
  }
  .segs { display: flex; gap: 0.125rem; background: var(--fill); border-radius: 0.375rem; padding: 0.0625rem; }
  .segs .seg {
    width: auto; padding: 0 0.3125rem; height: 1rem;
    font-size: 0.625rem; font-weight: 600; border-radius: 0.3125rem;
  }
  .segs .seg.on { background: var(--fill-hi); color: var(--label); }

  .calwd { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.0625rem; }
  .calwd span { font-size: 0.5625rem; color: var(--tertiary); text-align: center; }
  .calwd span:first-child { color: var(--sun); }

  .calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.0625rem; }
  .cday {
    aspect-ratio: 1 / 1;
    border-radius: 0.3125rem;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.09375rem;
    font-size: 0.625rem; color: var(--label);
    cursor: default;
  }
  .cday:hover { background: var(--fill); }
  .cday.out { color: var(--tertiary); }
  .cday.sun { color: var(--sun); }
  .cday.today { box-shadow: inset 0 0 0 1px var(--tint); font-weight: 700; }
  .cday.on { background: var(--tint); color: #06231d; font-weight: 700; }
  .cdots { display: flex; gap: 0.0625rem; height: 0.1875rem; }
  .cdots i { width: 0.1875rem; height: 0.1875rem; border-radius: 50%; background: var(--tint); }
  .cday.on .cdots i { background: #06231d; }

  .callist { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 0.125rem; }
  .callist::-webkit-scrollbar { width: 3px; }
  .callist::-webkit-scrollbar-thumb {
    background: transparent; border-radius: 2px; transition: background 0.15s;
  }
  .callist:hover::-webkit-scrollbar-thumb { background: var(--fill-hi); }
  /* 메일 줄은 제목만 쓰므로 한 칸 — 두 칸으로 두면 제목이 좁은 칸에 갇혀 잘린다 */
  .cev.mailrow { grid-template-columns: 1fr; }
  .cev {
    display: grid; grid-template-columns: 2.25rem 1fr; gap: 0.375rem;
    align-items: baseline; font-size: 0.625rem;
    padding: 0.125rem 0.1875rem; border-radius: 0.25rem;
  }
  .cev:hover { background: var(--fill); }
  .cev .tm { color: var(--secondary); font-variant-numeric: tabular-nums; }
  .cev .nm { color: var(--label); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 안 읽은 메일만 색으로 튀게 한다. 읽은 것은 평소 글자색으로 가라앉힌다 —
     둘 다 강조하면 아무것도 강조되지 않는다. */
  .cev.mailrow .nm { color: var(--unread); font-weight: 600; }
  .cev.mailrow.read .nm { color: var(--secondary); font-weight: 400; }
  /* 규칙이 묶어둔 줄 — 한 통이 아니라 «뭉치»라는 게 보여야 한다.
     안쪽 줄은 한 칸 들여써서 어디까지가 묶음인지 눈으로 잡히게 한다. */
  .cev.mailgroup .nm, .sheet .row.ev.mail.mailgroup .nm {
    color: var(--secondary); font-weight: 500;
  }
  .cev.mailgroup, .sheet .row.ev.mail.mailgroup { cursor: pointer; }
  .cev.ingroup, .sheet .row.ev.mail.ingroup { padding-left: 0.75rem; }
  .sheet .row.ev.mail.mailgroup .evdot { background: var(--tertiary); }
  .calempty { font-size: 0.625rem; color: var(--tertiary); padding: 0.1875rem; }
  .inner { transition: opacity 0.16s ease; }
  .card.open .inner { opacity: 0; pointer-events: none; }
  /* 시트는 제 배경이 없다(카드의 유리를 그대로 쓴다). 그래서 시트를 열면 뒤에 있는 것을
     같이 숨겨야 한다 — .inner만 숨기고 달력·메일 패널을 두면 글자가 겹쳐 보인다. */
  .cal { transition: opacity 0.16s ease; }
  .card.open .cal { opacity: 0; pointer-events: none; }
  .sheet .sh {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 0.625rem; font-weight: 650; letter-spacing: 0.02em;
    color: var(--tertiary);
    padding: 0 0.125rem 0.125rem;
    flex: none;
  }
  .sheet .sh button {
    all: unset; cursor: default;
    font-family: inherit; font-size: 0.625rem; font-weight: 650;
    color: color-mix(in srgb, var(--tint) 85%, white);
  }
  .sheet .sh button:hover { text-decoration: underline; }
  .sheet .rows { display: flex; flex-direction: column; gap: 0.1875rem; overflow-y: auto; min-height: 0; }
  #sheet-rows { flex: 1; }   /* 남는 높이는 알림 목록이 갖고, 일정은 제 몫만 */
  .sheet .rows::-webkit-scrollbar { width: 3px; }
  .sheet .rows::-webkit-scrollbar-thumb {
    background: transparent; border-radius: 2px; transition: background 0.15s;
  }
  .sheet .rows:hover::-webkit-scrollbar-thumb { background: var(--fill-hi); }
  .sheet .row {
    display: grid; grid-template-columns: 0.875rem 1fr auto;
    align-items: center; gap: 0.4375rem;
    padding: 0.25rem 0.3125rem;
    margin: 0 -0.1875rem;
    border-radius: 0.375rem;
    font-size: 0.6875rem;
    transition: background 0.1s;
  }
  .sheet .row:hover { background: var(--fill); }

  /* 오늘 일정 — 알림 목록 아래에 얇게 붙인다 */
  /* 오늘 일정은 아래에 붙되, 위쪽 알림 목록을 밀어내지 않도록 제 몫만 차지한다 */
  .sched {
    display: none; flex: none;
    margin-top: 0.375rem; padding-top: 0.375rem;
    border-top: 0.5px solid var(--hairline);
  }
  .sched .sh { margin-bottom: 0.1875rem; }
  .sched .rows { max-height: 5.25rem; }
  .sheet .row.ev { grid-template-columns: 0.375rem 1fr auto; }
  .evdot {
    width: 0.3125rem; height: 0.3125rem; border-radius: 50%;
    background: var(--tertiary); justify-self: center;
  }
  .sheet .row.ev.now .evdot { background: var(--tint); }
  .sheet .row.ev.now .nm { color: var(--label); font-weight: 600; }
  .sheet .row.ev.read { opacity: 0.55; }
  /* 시트의 메일 줄도 같은 규칙 — 안 읽은 것만 색이 다르다 */
  .sheet .row.ev.mail .nm { color: var(--unread); font-weight: 600; }
  .sheet .row.ev.mail.read .nm { color: var(--label); font-weight: 400; }
  .sheet .row.ev.mail .evdot { background: var(--unread); }
  .sheet .row.ev.mail.read .evdot { background: var(--tertiary); }
  .sheet .row.ev.read .evdot { background: var(--tertiary); }
  .sheet .row .g { width: 0.875rem; height: 0.875rem; }
  .sheet .row .nm { color: var(--label); font-weight: 540; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet .row .tm { color: var(--secondary); font-variant-numeric: tabular-nums; font-weight: 560; }
  .sheet .row.next .tm { color: color-mix(in srgb, var(--tint) 88%, white); }
  .sheet .empty { font-size: 0.6875rem; color: var(--tertiary); padding: 0.375rem 0.125rem; }

  /* ── 호버 컨트롤 ──
     카드 안이 아니라 카드 아래 예약된 띠에 띄운다 — 메인 내용을 가리지 않는다. */
  .ctlwrap {
    position: absolute;
    left: 0; right: 0; top: 100%;
    height: var(--ctlh);
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transform: translateY(-5px);
    pointer-events: none;
    transition: opacity 0.16s ease, transform 0.2s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .stage:hover .ctlwrap { opacity: 1; transform: none; pointer-events: auto; }

  .controls {
    display: flex; align-items: center; gap: 0.375rem;
    padding: 0.3125rem;
    border-radius: 999px;
    background: var(--bar);
    box-shadow:
      inset 0 0 0 0.5px var(--hairline),
      0 4px 12px rgba(0, 0, 0, 0.40);
  }
  .controls button {
    all: unset;
    cursor: default;
    display: grid; place-items: center;
    width: 1.75rem; height: 1.75rem;
    border-radius: 50%;
    background: var(--fill);
    color: var(--label);
    transition: background 0.12s;
  }
  .controls button:hover { background: var(--fill-hi); }
  .controls button.primary {
    width: auto; padding: 0 0.6875rem; border-radius: 999px;
    grid-auto-flow: column; gap: 0.25rem;
    background: color-mix(in srgb, var(--tint) 82%, black);
    color: #fff;
  }
  .controls button.primary:hover { filter: brightness(1.12); }
  .controls button.primary span { font-family: inherit; font-size: 0.6875rem; font-weight: 650; letter-spacing: -0.01em; }
  .controls svg { width: 0.8125rem; height: 0.8125rem; display: block; }
  .controls button:focus-visible { box-shadow: 0 0 0 2px color-mix(in srgb, var(--tint) 70%, transparent); }

  /* ── 업데이트 알림 칩 ──
     카드 우측 상단 구석에 조용히 뜬다. 한 번 누르면 확인, 한 번 더 누르면 설치. */
  .upchip {
    all: unset;
    cursor: default;
    position: absolute;
    top: 0.5rem; right: 0.5rem;
    z-index: 8;
    display: none;
    align-items: center;
    gap: 0.25rem;
    font-family: inherit;
    font-size: 0.625rem;
    font-weight: 650;
    letter-spacing: -0.01em;
    color: color-mix(in srgb, var(--tint) 90%, white);
    background: color-mix(in srgb, var(--tint) 22%, transparent);
    box-shadow: inset 0 0 0 0.5px color-mix(in srgb, var(--tint) 45%, transparent);
    padding: 0.1875rem 0.4375rem;
    border-radius: 999px;
    max-width: calc(100% - 1rem);
    white-space: nowrap;
    animation: upfade 0.4s ease both;
  }
  .card.has-update .upchip { display: inline-flex; }
  /* 칩이 뜨면 같은 자리의 오늘 횟수는 양보한다 */
  .card.has-update .head .ct { display: none; }
  .upchip svg { width: 0.625rem; height: 0.625rem; flex: none; }
  .upchip:hover { background: color-mix(in srgb, var(--tint) 34%, transparent); }
  .upchip.armed {
    color: #fff;
    background: color-mix(in srgb, var(--tint) 88%, black);
    box-shadow: none;
  }
  @keyframes upfade { from { opacity: 0; transform: translateY(-3px); } }

  /* ── 리사이즈 그립 ── */
  .grip {
    position: absolute; right: 0; bottom: 0;
    width: 0.9375rem; height: 0.9375rem;
    /* 표시 전용 — 실제 드래그는 아래 .rz(리사이즈 존)가 받는다 */
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 6;
  }

  /* 가장자리·모서리 리사이즈 존.
     OS 네이티브 리사이즈는 이 창(투명·프레임 없음)에서 저 혼자 커지는 버그가 있어
     쓰지 않는다. 카드 테두리 위에 걸치게 두어 조준하기 쉽게 한다. */
  .rz { position: absolute; z-index: 8; }
  .rz-n { left: 12px; right: 12px; top: -5px; height: 10px; cursor: ns-resize; }
  .rz-s { left: 12px; right: 12px; bottom: -5px; height: 10px; cursor: ns-resize; }
  .rz-w { top: 12px; bottom: 12px; left: -5px; width: 10px; cursor: ew-resize; }
  .rz-e { top: 12px; bottom: 12px; right: -5px; width: 10px; cursor: ew-resize; }
  .rz-nw { left: -5px; top: -5px; width: 17px; height: 17px; cursor: nwse-resize; }
  .rz-ne { right: -5px; top: -5px; width: 17px; height: 17px; cursor: nesw-resize; }
  .rz-sw { left: -5px; bottom: -5px; width: 17px; height: 17px; cursor: nesw-resize; }
  .rz-se { right: -5px; bottom: -5px; width: 17px; height: 17px; cursor: nwse-resize; }
  .stage:hover .grip { opacity: 0.45; }
  .grip svg { width: 100%; height: 100%; color: var(--label); }

  @media (prefers-reduced-motion: reduce) {
    .prog, .controls { transition: none; }
  }
</style>
</head>
<body>
 <div class="stage" id="stage">
  <div class="card r-base" id="card">
    <div class="prog" id="prog"></div>

    <div class="inner">
      <div class="head">
        <span class="tags" id="tags"></span>
        <span class="sp"></span>
        <span class="ct" id="count"></span>
      </div>
      <div class="time" id="time">--:--</div>
      <div class="chips" id="chips"></div>
      <div class="week" id="week"></div>
    </div>

    <div class="sheet" id="sheet">
      <div class="sh"><span>예정된 알림</span><button id="sheet-stats">기록 보기</button></div>
      <div class="rows" id="sheet-rows"></div>
      <div class="sched" id="sched">
        <div class="sh"><span>오늘 일정</span><button id="sheet-cal">달력</button></div>
        <div class="rows" id="sched-rows"></div>
      </div>
      <div class="sched" id="mailbox">
        <div class="sh">
          <span id="mail-ttl">새 메일</span>
          <span class="note" id="mail-note"></span>
          <button id="mail-refresh" type="button" title="지금 메일 확인">↻</button>
          <button id="mail-write" type="button">쓰기</button>
          <button id="mail-allread" type="button">모두 읽음</button>
        </div>
        <div class="rows" id="mail-rows"></div>
      </div>
    </div>

    <!-- 메일 — 시트를 열지 않아도 보이도록 카드 안에서 아래로 늘어난다 -->
    <div class="cal mailpanel" id="mailpanel">
      <div class="calnav">
        <span class="cttl" id="mp-ttl">메일</span>
        <span class="note" id="mp-note"></span>
        <button class="txt" id="mp-refresh" title="지금 메일 확인">↻</button>
        <button class="txt" id="mp-write" title="새 메일 쓰기">쓰기</button>
        <button class="txt" id="mp-allread" title="안 읽은 메일을 모두 읽음으로 표시">모두 읽음</button>
      </div>
      <div class="callist" id="mp-list"></div>
    </div>

    <!-- 달력 — 별도 창이 아니라 카드 안에서 아래로 늘어난다 -->
    <div class="cal" id="cal">
      <div class="calnav">
        <button id="cal-prev" title="이전">‹</button>
        <span class="cttl" id="cal-ttl"></span>
        <button id="cal-next" title="다음">›</button>
        <span class="segs">
          <button id="cal-week" class="seg">주</button>
          <button id="cal-month" class="seg on">월</button>
        </span>
      </div>
      <div class="calwd">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div class="calgrid" id="cal-grid"></div>
      <div class="callist" id="cal-list"></div>
    </div>

    <button class="upchip" id="upchip" title="업데이트 설치"></button>

    <div class="grip" id="grip" title="드래그해서 크기 조절">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <path d="M13 6.5 6.5 13M13 11l-2 2"/>
      </svg>
    </div>
  </div>

  <!-- 가장자리·모서리 리사이즈 존 (카드 테두리 위에 걸침) -->
  <div class="rz rz-n" data-dir="n"></div>
  <div class="rz rz-s" data-dir="s"></div>
  <div class="rz rz-w" data-dir="w"></div>
  <div class="rz rz-e" data-dir="e"></div>
  <div class="rz rz-nw" data-dir="nw"></div>
  <div class="rz rz-ne" data-dir="ne"></div>
  <div class="rz rz-sw" data-dir="sw"></div>
  <div class="rz rz-se" data-dir="se"></div>

  <div class="ctlwrap">
    <div class="controls">
      <button id="btn-now" class="primary" title="지금 알림 실행"><span>지금 쉬기</span></button>
      <button id="btn-pause" title="일시정지 / 재개"></button>
      <button id="btn-cal" title="달력 보이기 / 숨기기"></button>
      <button id="btn-mail" title="메일 보이기 / 숨기기"></button>
      <button id="btn-set" title="설정"></button>
      <button id="btn-hide" title="위젯 숨기기"></button>
    </div>
  </div>
 </div>

<script src="widget.js"></script>
</body>
</html>
