<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 본문은 메일에서 온 HTML이다. 여기서 외부 요청을 전부 막는다 —
     그림은 data: 만, 스크립트·글꼴·프레임은 아예 불가. -->
<!-- 본문은 메일에서 온 HTML이다. 스크립트·프레임·외부 연결은 어떤 경우에도 막고,
     그림만 설정에 따라 열어준다 (아래 스크립트가 img-src를 조정한다). -->
<meta http-equiv="Content-Security-Policy" id="csp"
      content="default-src 'none';
               script-src file: 'unsafe-inline';
               style-src file: 'unsafe-inline';
               font-src file:;
               img-src data: https: http:">
<title>메일</title>
<link rel="stylesheet" href="../assets/font/pretendard.css">
<script src="icons.js"></script>
<style>
  :root {
    --accent: #4fc3a8;
    --scrim-a: 0.86;
    --scrim: rgba(26, 26, 30, var(--scrim-a));
    --label: rgba(255, 255, 255, 0.96);
    --secondary: rgba(235, 235, 245, 0.62);
    --tertiary: rgba(235, 235, 245, 0.34);
    --fill: rgba(255, 255, 255, 0.07);
    --fill-hi: rgba(255, 255, 255, 0.16);
    --hairline: rgba(255, 255, 255, 0.16);
    --separator: rgba(255, 255, 255, 0.10);
  }
  :root[data-theme="light"] {
    --accent: #23a58a;
    --scrim: rgba(250, 250, 252, var(--scrim-a));
    --label: rgba(0, 0, 0, 0.90);
    --secondary: rgba(60, 60, 67, 0.62);
    --tertiary: rgba(60, 60, 67, 0.40);
    --fill: rgba(0, 0, 0, 0.05);
    --fill-hi: rgba(0, 0, 0, 0.10);
    --hairline: rgba(0, 0, 0, 0.14);
    --separator: rgba(60, 60, 67, 0.13);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI Variable Display', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--label);
    padding: var(--inset, 12px);
  }
  /* 리사이즈 존의 기준 — 없으면 존이 창 밖에 놓여 잡히지 않는다 */
  .stage { position: relative; width: 100%; height: 100%; }
  .card {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    background: var(--scrim);
    border-radius: var(--r, 20px);
    overflow: hidden;
    box-shadow: inset 0 0 0 0.5px var(--hairline), 0 6px 20px rgba(0, 0, 0, 0.42);
  }
  /* 제목줄을 끌어 창을 옮긴다.
     app-region: drag는 OS가 마우스를 가져가 닫기 버튼 클릭이 안 잡히므로 직접 처리한다. */
  .head { flex: none; padding: 14px 16px 10px; display: flex; gap: 10px; align-items: flex-start; cursor: default; }
  .head .box { flex: 1; min-width: 0; }
  .subject { font-size: 14px; font-weight: 650; line-height: 1.35; word-break: break-word; }
  .meta { font-size: 11.5px; color: var(--tertiary); margin-top: 4px; }
  /* 받는 사람 줄 — 길어도 한 줄로 두고 …으로 줄인다. 전체는 title로 본다.
     여기서 줄바꿈을 허용하면 사람이 열 명일 때 머리글이 본문을 밀어낸다. */
  .meta.who { margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 읽음 상태 — 지금 상태를 보여주고, 누르면 바뀐다.
     열었다고 자동으로 읽음이 되지 않으므로 이 칩이 유일한 표시이자 조작이다. */
  .seen {
    all: unset; cursor: default; flex: none;
    font-family: inherit; font-size: 11px; font-weight: 600;
    padding: 4px 9px; border-radius: 999px; white-space: nowrap;
    background: var(--fill); color: var(--secondary);
    transition: background 0.15s, color 0.15s;
  }
  .seen.unread { background: color-mix(in srgb, #f5a623 22%, transparent); color: #f5a623; }
  .seen:hover { background: var(--fill-hi); }
  .seen.busy { opacity: 0.5; }
  .close {
    all: unset; cursor: default; flex: none;
    width: 24px; height: 24px; border-radius: 50%;
    display: grid; place-items: center; color: var(--secondary);
  }
  .close svg { width: 12px; height: 12px; }
  .close:hover { background: var(--fill); color: var(--label); }

  .body {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 10px 16px 16px;
    border-top: 0.5px solid var(--separator);
    font-size: 12.5px; line-height: 1.72; color: var(--secondary);
    white-space: pre-wrap;
    /* 한글은 크롬 기본값으로는 아무 글자 사이에서나 줄이 넘어가서, 낱말 한가운데가
       잘리고 자간이 들쭉날쭉해 보인다. keep-all은 띄어쓰기에서만 넘긴다.
       띄어쓰기 없는 긴 주소만 anywhere로 따로 풀어준다. */
    word-break: keep-all;
    overflow-wrap: anywhere;
    user-select: text;
  }
  /* 메일 원본 HTML을 그릴 때는 pre-wrap을 풀고 메일이 정한 서식을 살린다.
     배경은 흰색으로 둔다 — 메일은 흰 배경을 전제로 글자색을 정하므로
     어두운 카드 위에 그대로 얹으면 검은 글씨가 안 보인다. */
  .body.rich {
    white-space: normal;
    background: #fff; color: #1a1a1a;
    margin: 0; padding: 14px 16px;
  }
  .body.rich img { max-width: 100%; height: auto; }
  .body.rich table { max-width: 100%; border-collapse: collapse; }
  .body.rich td, .body.rich th { padding: 2px 6px; }
  .body.rich a { color: var(--accent); }
  .body.rich * { max-width: 100%; }
  .blocked {
    font-size: 11px; color: var(--tertiary);
    background: var(--fill); border-radius: 8px;
    padding: 6px 10px; margin: 0 16px 10px;
  }
  .body::-webkit-scrollbar { width: 8px; }
  .body::-webkit-scrollbar-thumb {
    background: transparent; border-radius: 4px; transition: background 0.15s;
  }
  .body:hover::-webkit-scrollbar-thumb { background: var(--fill-hi); }
  .note { color: var(--tertiary); font-size: 11.5px; }

  /* 첨부 — 메일에 들어 있는 그림만 보여준다 (원격 이미지는 받지 않는다) */
  /* 첨부가 많으면 본문이 밀려난다 — 제 몫만 쓰고 넘치면 그 안에서 스크롤 */
  .atts {
    flex: none; max-height: 38%; overflow-y: auto;
    border-top: 0.5px solid var(--separator); padding: 10px 16px 12px;
  }
  .atts .cap { font-size: 11px; color: var(--tertiary); margin-bottom: 8px; }
  .shots { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .shots img {
    max-width: 100%; max-height: 220px; border-radius: 8px; display: block;
    box-shadow: inset 0 0 0 0.5px var(--hairline); cursor: default;
  }
  .files { display: flex; flex-wrap: wrap; gap: 6px; }
  .file {
    all: unset; cursor: default;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; padding: 5px 9px; border-radius: 8px;
    background: var(--fill); color: var(--label);
  }
  .file:hover { background: var(--fill-hi); }
  .file .sz { color: var(--tertiary); font-variant-numeric: tabular-nums; }
  .saved { font-size: 11px; color: var(--accent); margin-top: 8px; }
  /* 파일 칩 — 이름을 누르면 미리보기, 저장은 따로 */
  .file .go { color: var(--tertiary); font-size: 11px; }
  .file:hover .go { color: var(--accent); }
  .fsave {
    all: unset; cursor: default; font-size: 11px; color: var(--tertiary);
    padding: 5px 7px; border-radius: 8px; background: var(--fill);
  }
  .fsave:hover { background: var(--fill-hi); color: var(--label); }
  .fpair { display: inline-flex; gap: 3px; }
  /* 글 미리보기 — 첨부로 온 글은 글자로만 보여준다 (HTML이어도 그린 적이 없다) */
  .ftext {
    margin-top: 8px; max-height: 240px; overflow: auto;
    background: #fff; color: #1a1a1a; border-radius: 8px; padding: 10px 12px;
    font-family: Consolas, "D2Coding", monospace; font-size: 11.5px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word; user-select: text;
  }
  .ftext .cap { color: #5f6368; font-size: 10.5px; margin-bottom: 6px; }
  /* 그림 크게 보기 — 창 안에서 덮는다 (새 창을 띄울 일이 아니다) */
  .lightbox {
    position: fixed; inset: 0; z-index: 20; display: none;
    background: rgba(0, 0, 0, 0.82); place-items: center; padding: 24px;
  }
  .lightbox.on { display: grid; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  .lightbox .hint {
    position: absolute; left: 0; right: 0; bottom: 10px; text-align: center;
    color: rgba(255,255,255,0.72); font-size: 11px;
  }
  .shots img { cursor: zoom-in; }

  /* 가장자리 리사이즈 — 위젯과 같은 방식 (네이티브는 투명 창에서 폭주한다) */
  .rz { position: absolute; z-index: 9; }
  .rz-n { left: 12px; right: 12px; top: -4px; height: 10px; cursor: ns-resize; }
  .rz-s { left: 12px; right: 12px; bottom: -4px; height: 10px; cursor: ns-resize; }
  .rz-w { top: 12px; bottom: 12px; left: -4px; width: 10px; cursor: ew-resize; }
  .rz-e { top: 12px; bottom: 12px; right: -4px; width: 10px; cursor: ew-resize; }
  .rz-nw { left: -4px; top: -4px; width: 16px; height: 16px; cursor: nwse-resize; }
  .rz-ne { right: -4px; top: -4px; width: 16px; height: 16px; cursor: nesw-resize; }
  .rz-sw { left: -4px; bottom: -4px; width: 16px; height: 16px; cursor: nesw-resize; }
  .rz-se { right: -4px; bottom: -4px; width: 16px; height: 16px; cursor: nwse-resize; }
</style>
</head>
<body>
<div class="stage">
<div class="card">
  <div class="head">
    <div class="box">
      <div class="subject" id="subject">불러오는 중…</div>
      <div class="meta" id="meta"></div>
      <!-- 누가 같이 받았는지. 회사 메일은 «나에게만 온 것»과 «전체에게 온 것»이
           일하는 방식을 바꾼다 — 답장 전에 알아야 한다. -->
      <div class="meta who" id="who"></div>
    </div>
    <button class="seen" id="reply" style="display:none" title="답장 쓰기">답장</button>
    <button class="seen" id="copy" style="display:none" title="이 메일을 그대로 복사해 다시 씁니다">복사</button>
    <button class="seen" id="forward" style="display:none" title="전달하기">전달</button>
    <button class="seen" id="trash" style="display:none" title="휴지통으로 옮기기 (되찾을 수 있습니다)">휴지통</button>
    <button class="seen" id="seen" style="display:none"></button>
    <button class="close" id="close" title="닫기"></button>
  </div>
  <div class="body" id="body"></div>
  <div class="blocked" id="blocked" style="display:none"></div>
  <div class="atts" id="atts" style="display:none">
    <div class="cap" id="atts-cap"></div>
    <div class="shots" id="shots"></div>
    <div class="files" id="files"></div>
    <div class="saved" id="saved"></div>
    <div class="ftext" id="ftext" style="display:none"></div>
  </div>
</div>
<div class="lightbox" id="lightbox">
  <img id="lightbox-img" alt="">
  <div class="hint">아무 데나 누르면 닫힙니다</div>
</div>
<div class="rz rz-n" data-dir="n"></div>
<div class="rz rz-s" data-dir="s"></div>
<div class="rz rz-w" data-dir="w"></div>
<div class="rz rz-e" data-dir="e"></div>
<div class="rz rz-nw" data-dir="nw"></div>
<div class="rz rz-ne" data-dir="ne"></div>
<div class="rz rz-sw" data-dir="sw"></div>
<div class="rz rz-se" data-dir="se"></div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  if (q.get('theme') === 'light') document.documentElement.dataset.theme = 'light';
  if (q.get('scrim')) document.documentElement.style.setProperty('--scrim-a', q.get('scrim'));
  if (q.get('inset')) document.documentElement.style.setProperty('--inset', q.get('inset') + 'px');
  if (q.get('radius')) document.documentElement.style.setProperty('--r', q.get('radius') + 'px');

  $('close').append(window.nunsIcon('close'));
  $('close').onclick = () => window.nunsseom.mailViewClose();
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') window.nunsseom.mailViewClose();
  });

  // 제목줄 드래그로 창 이동
  const head = document.querySelector('.head');
  let press = null;
  head.addEventListener('pointerdown', async (e) => {
    if (e.button !== 0 || e.target.closest('#close')) return;
    const b = await window.nunsseom.mailViewBounds();
    press = { sx: e.screenX, sy: e.screenY, x: b.x, y: b.y };
    try { head.setPointerCapture(e.pointerId); } catch {}
  });
  head.addEventListener('pointermove', (e) => {
    if (!press) return;
    window.nunsseom.mailViewMove({
      x: press.x + (e.screenX - press.sx),
      y: press.y + (e.screenY - press.sy)
    });
  });
  const endMove = (e) => {
    if (!press) return;
    press = null;
    try { head.releasePointerCapture(e.pointerId); } catch {}
  };
  head.addEventListener('pointerup', endMove);
  head.addEventListener('pointercancel', endMove);

  // 가장자리 드래그로 창 크기 조절 — 조절한 크기는 메인이 저장한다
  let rz = null;
  for (const zone of document.querySelectorAll('.rz')) {
    zone.addEventListener('pointerdown', async (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      try { zone.setPointerCapture(e.pointerId); } catch {}
      const b = await window.nunsseom.mailViewBounds();
      rz = { dir: zone.dataset.dir, sx: e.screenX, sy: e.screenY, ...b };
    });
    zone.addEventListener('pointermove', (e) => {
      if (!rz) return;
      const dx = e.screenX - rz.sx;
      const dy = e.screenY - rz.sy;
      let { x, y, width, height } = rz;
      if (rz.dir.includes('e')) width = rz.width + dx;
      if (rz.dir.includes('s')) height = rz.height + dy;
      if (rz.dir.includes('w')) { width = rz.width - dx; x = rz.x + dx; }
      if (rz.dir.includes('n')) { height = rz.height - dy; y = rz.y + dy; }
      window.nunsseom.mailViewSetBounds({ x, y, width, height, dir: rz.dir });
    });
    const end = (e) => {
      if (!rz) return;
      rz = null;
      try { zone.releasePointerCapture(e.pointerId); } catch {}
    };
    zone.addEventListener('pointerup', end);
    zone.addEventListener('pointercancel', end);
  }

  const fmt = (ms) => {
    const d = new Date(ms);
    return `${d.getMonth() + 1}월 ${d.getDate()}일 `
      + `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  };

  const kb = (n) => (n >= 1024 * 1024
    ? (n / 1024 / 1024).toFixed(1) + 'MB'
    : Math.max(1, Math.round(n / 1024)) + 'KB');

  /** 그림 크게 보기 */
  function zoom(src, alt) {
    $('lightbox-img').src = src;
    $('lightbox-img').alt = alt || '';
    $('lightbox').classList.add('on');
  }
  $('lightbox').onclick = () => {
    $('lightbox').classList.remove('on');
    $('lightbox-img').src = '';
  };

  /**
   * 첨부 하나를 그 자리에서 본다.
   * 그림은 이 창이 이미 들고 있으므로 바로 키우고, 나머지는 메인이 판단한다.
   */
  async function previewOne(a) {
    $('saved').textContent = '';
    if (a.dataUrl) { zoom(a.dataUrl, a.filename); return; }
    $('ftext').style.display = 'none';
    $('saved').textContent = '여는 중…';
    let r;
    try {
      r = await window.nunsseom.mailPreviewAttachment(a.index);
    } catch (err) {
      $('saved').textContent = '미리보기 실패 — ' + (err && err.message ? err.message : String(err));
      return;
    }
    if (!r) { $('saved').textContent = '미리보기가 응답하지 않았습니다'; return; }
    if (r.kind === 'text') {
      // 글자 노드로만 넣는다 — 첨부로 온 HTML이 여기서 살아나면 안 된다
      const box = $('ftext');
      box.textContent = '';
      const cap = document.createElement('div');
      cap.className = 'cap';
      cap.textContent = `${a.filename} · ${kb(a.size)}`
        + (r.encoding === 'cp949' ? ' · CP949로 읽음' : '');
      box.append(cap, document.createTextNode(r.text || '(빈 파일)'));
      box.style.display = 'block';
      $('saved').textContent = '';
      return;
    }
    if (r.kind === 'image') {
      // 본문에 박힌 그림·큰 그림은 목록에 dataUrl이 없다. 누른 뒤에야 받아서 키운다.
      zoom(r.dataUrl, a.filename);
      $('saved').textContent = '';
      return;
    }
    if (r.kind === 'pdf') { $('saved').textContent = '새 창에서 열었습니다'; return; }
    $('saved').textContent = r.message || '미리보기를 못 합니다';
  }

  function renderAttachments(list) {
    if (!list.length) return;
    $('atts').style.display = 'block';
    // 본문에 박힌 그림은 이미 본문에서 보이므로 여기서 또 크게 깔지 않는다
    const images = list.filter((a) => a.dataUrl && !a.inline);
    const inlineCount = list.filter((a) => a.inline).length;
    // 본문에 박힌 그림을 «첨부»에 넣어 세면 안 된다 — 서명에 그림이 둘 든 메일이
    // «첨부 2개»가 되어, 붙어 온 파일이 없는데 있다고 말하는 꼴이 된다.
    const fileCount = list.length - inlineCount;
    $('atts-cap').textContent = [
      fileCount ? `첨부 ${fileCount}개` : '',
      inlineCount ? `본문 그림 ${inlineCount}` : '',
      images.length ? `그림 ${images.length}` : ''
    ].filter(Boolean).join(' · ') || '첨부 없음';

    for (const a of images) {
      const img = document.createElement('img');
      img.src = a.dataUrl;          // 메일에 담겨 온 그림이라 네트워크를 타지 않는다
      img.alt = a.filename;
      img.title = `${a.filename} · ${kb(a.size)} · 누르면 크게 봅니다`;
      img.onclick = () => zoom(a.dataUrl, a.filename);
      $('shots').append(img);
    }
    // 칩 하나에 둘이 붙는다 — 이름을 누르면 미리보기, 옆의 «저장»은 저장.
    // 예전엔 누르면 곧바로 저장 대화상자였다. 안을 보려고 매번 저장할 이유가 없다.
    for (const a of list) {
      const pair = document.createElement('span');
      pair.className = 'fpair';

      const b = document.createElement('button');
      b.className = 'file';
      const nm = document.createElement('span');
      nm.textContent = a.filename;
      const sz = document.createElement('span');
      sz.className = 'sz';
      sz.textContent = kb(a.size);
      const go = document.createElement('span');
      go.className = 'go';
      go.textContent = '보기';
      b.append(nm, sz, go);
      b.title = '누르면 미리보기';
      b.onclick = () => previewOne(a);

      const sv = document.createElement('button');
      sv.className = 'fsave';
      sv.textContent = '저장';
      sv.title = '파일로 저장';
      sv.onclick = async (ev) => {
        ev.stopPropagation();
        const r = await window.nunsseom.mailSaveAttachment(a.index);
        if (r && r.ok) {
          $('saved').textContent = `저장했습니다 — ${r.path}`;
          $('saved').onclick = () => window.nunsseom.mailReveal(r.path);
        } else if (r && r.message) {
          $('saved').textContent = r.message;
        }
      };

      pair.append(b, sv);
      $('files').append(pair);
    }
  }

  // ── 읽음 / 안 읽음 ────────────────────────────────
  // 이 창은 메일을 열었다고 읽음으로 바꾸지 않는다. 지금 상태를 보여주고,
  // 누르면 그때 바꾼다 — 한 통씩 손으로 정할 수 있게.
  function setupSeen(m) {
    const btn = $('seen');
    let seen = !!m.seen;
    let busy = false;

    const paint = () => {
      btn.style.display = '';
      btn.textContent = seen ? '읽음' : '안 읽음';
      btn.classList.toggle('unread', !seen);
      btn.classList.toggle('busy', busy);
      btn.title = seen ? '누르면 안 읽음으로 되돌립니다' : '누르면 읽음으로 표시합니다';
    };
    paint();

    btn.onclick = async () => {
      if (busy) return;
      const want = !seen;
      busy = true;
      seen = want;             // 서버를 기다리지 않고 먼저 바꿔 보여준다
      paint();
      // 폴더를 안 보내면 받은편지함의 «같은 번호» 메일이 바뀐다 — UID는 폴더마다 따로 돈다.
      // 보낸메일함 12번을 읽음 처리했더니 받은편지함 12번이 읽음이 되는 식이다.
      const r = await window.nunsseom.mailMarkRead({
        accountId: m.accountId, uids: [m.uid], read: want, mailbox: m.mailbox || ''
      });
      busy = false;
      if (!r || r.ok === false) {
        seen = !want;          // 서버가 거부했으면 되돌린다 — 바뀐 척하면 안 된다
        btn.title = (r && r.message) || '바꾸지 못했습니다';
      }
      paint();
    };
  }

  /**
   * 누가 같이 받았는지 한 줄로.
   *
   * 사람이 많으면 앞 몇만 적고 «외 N명»으로 줄인다 — 열 명을 다 적으면 머리글이
   * 본문을 밀어낸다. 전체 목록은 마우스를 올리면 나온다.
   */
  function pickNames(text, keep) {
    // "이름" <주소>, "이름2" <주소2> — 따옴표 안의 쉼표에 속지 않게 자른다
    const parts = String(text || '').match(/(?:"[^"]*"|[^,])+/g) || [];
    const names = parts.map((s) => {
      const t = s.trim();
      const m = t.match(/^"?([^"<]*?)"?\s*<([^>]+)>$/);
      // 이름이 있으면 이름을, 없으면 주소를 (주소만 온 경우가 흔하다)
      return ((m && m[1].trim()) || (m && m[2]) || t).trim();
    }).filter(Boolean);
    if (names.length <= keep) return names.join(', ');
    return `${names.slice(0, keep).join(', ')} 외 ${names.length - keep}명`;
  }

  function showWho(m) {
    const line = [];
    if (m.to) line.push(`받는 사람 ${pickNames(m.to, 3)}`);
    if (m.cc) line.push(`참조 ${pickNames(m.cc, 2)}`);
    const el = $('who');
    if (!line.length) { el.style.display = 'none'; return; }
    el.style.display = '';
    el.textContent = line.join(' · ');
    // 줄인 것을 확인할 길은 남겨둔다 — 주소까지 통째로
    el.title = [m.to ? `받는 사람: ${m.to}` : '', m.cc ? `참조: ${m.cc}` : '']
      .filter(Boolean).join('\n');
  }

  /** 답장·전달 — 쓰기 창에 원문을 넘겨 초안을 만들게 한다 */
  function setupCompose(m) {
    // html도 같이 넘긴다 — 인용문을 원문 서식 그대로 넣기 위해서다.
    // 글(text)만 넘기던 때는 웹메일이 기계로 만든 text/plain이 인용문이 되어,
    // 답장 창을 열면 빈 줄과 두 번씩 적힌 주소부터 보였다.
    const src = {
      subject: m.subject, from: m.from, fromAddress: m.fromAddress, to: m.to,
      replyTo: m.replyTo, messageId: m.messageId, at: m.at,
      text: m.text, html: m.html
    };
    for (const [id, kind] of [['reply', 'reply'], ['forward', 'forward']]) {
      const b = $(id);
      // 보낸메일함의 메일은 내가 쓴 것이다 — 답장하면 나에게 간다. 전달만 남긴다.
      if (kind === 'reply' && m.fromSelf) continue;
      b.style.display = '';
      b.onclick = async () => {
        // 결과를 안 보면 실패했을 때 눌러도 아무 일도 안 일어난다 —
        // 계정이 꺼져 있거나 지워졌을 때 그랬다. 이유를 말해줘야 한다.
        b.disabled = true;
        const tell = (why) => {
          b.title = why;
          $('blocked').style.display = 'block';
          $('blocked').textContent = why;
        };
        try {
          const r = await window.nunsseom.composeOpen({ kind, accountId: m.accountId, source: src });
          // 메인이 아무것도 안 돌려주는 일은 없어야 하지만, 그러면 이유라도 남긴다
          if (!r) tell('쓰기 창이 응답하지 않았습니다');
          else if (r.ok === false) tell(r.message || '쓰기 창을 열지 못했습니다');
          else if (r.reused) tell(r.message || '쓰기 창이 이미 열려 있습니다');
        } catch (err) {
          // catch가 없으면 메인에서 터졌을 때 눌러도 아무 일도 안 일어난다 —
          // 이유 없이 안 되는 것처럼 보이는 게 제일 나쁘다.
          tell('쓰기 창을 여는 중 오류 — ' + (err && err.message ? err.message : String(err)));
        } finally {
          b.disabled = false;
        }
      };
    }

    // 복사(다시 보내기) — 내가 보낸 메일에서만. 답장이 나에게 가는 자리에 대신 둔다.
    // 원문 첨부의 바이트는 메인(slot.files)에 있으므로 메인이 창을 만든다.
    if (m.fromSelf) {
      const cb = $('copy');
      cb.style.display = '';
      cb.onclick = async () => {
        cb.disabled = true;
        const tell = (why) => {
          cb.title = why;
          $('blocked').style.display = 'block';
          $('blocked').textContent = why;
        };
        try {
          const r = await window.nunsseom.mailCopy();
          if (!r) tell('쓰기 창이 응답하지 않았습니다');
          else if (r.ok === false) tell(r.message || '복사해 열지 못했습니다');
          else if (r.reused) tell(r.message || '쓰기 창이 이미 열려 있습니다');
        } catch (err) {
          tell('복사하는 중 오류 — ' + (err && err.message ? err.message : String(err)));
        } finally {
          cb.disabled = false;
        }
      };
    }

    // 휴지통 — 물어보는 것도, 옮기고 창을 닫는 것도 메인이 한다.
    // 여기서는 결과만 받아 실패했을 때 이유를 남긴다.
    const tb = $('trash');
    tb.style.display = '';
    tb.onclick = async () => {
      tb.disabled = true;
      try {
        const r = await window.nunsseom.mailTrash();
        // 그만두기를 고른 것은 실패가 아니다 — 아무 말도 하지 않는다
        if (r && r.cancelled) return;
        if (!r) {
          $('blocked').style.display = 'block';
          $('blocked').textContent = '응답이 없습니다';
        } else if (r.ok === false) {
          $('blocked').style.display = 'block';
          $('blocked').textContent = r.message || '옮기지 못했습니다';
        }
        // 옮겨졌으면 메인이 이 창을 닫는다 — 여기서 할 일이 없다
      } catch (err) {
        $('blocked').style.display = 'block';
        $('blocked').textContent = '휴지통으로 옮기는 중 오류 — '
          + (err && err.message ? err.message : String(err));
      } finally {
        tb.disabled = false;
      }
    };
  }

  window.nunsseom.mailViewData().then((m) => {
    if (!m || m.error) {
      $('subject').textContent = '열 수 없습니다';
      $('body').textContent = (m && m.error) || '알 수 없는 오류';
      return;
    }
    $('subject').textContent = m.subject;
    $('meta').textContent = [m.from, fmt(m.at)].filter(Boolean).join(' · ');
    showWho(m);
    setupSeen(m);
    setupCompose(m);
    renderAttachments(m.attachments || []);
    if (m.blockedRemote) {
      $('blocked').style.display = 'block';
      $('blocked').textContent =
        `인터넷에서 받아오는 그림 ${m.blockedRemote}개는 표시하지 않았습니다`
        + ' (열어본 사실이 보낸 사람에게 전달될 수 있어요)';
    }
    if (m.html) {
      // 메인에서 위험한 태그를 걷어냈고, 이 창의 CSP가 외부 요청을 한 번 더 막는다
      $('body').classList.add('rich');
      $('body').innerHTML = m.html;
    } else if (m.text) {
      $('body').textContent = m.text;
    } else {
      const p = document.createElement('div');
      p.className = 'note';
      p.textContent = '글로 된 본문이 없습니다 (이미지나 첨부만 있는 메일일 수 있어요)';
      $('body').append(p);
    }
  });
</script>
</body>
</html>
