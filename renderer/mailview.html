<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 본문은 메일에서 온 HTML이다. 여기서 외부 요청을 전부 막는다 —
     그림은 data: 만, 스크립트·글꼴·프레임은 아예 불가. -->
<!-- 본문은 메일에서 온 HTML이다. 스크립트·프레임·외부 연결은 어떤 경우에도 막고,
     그림만 설정에 따라 열어준다 (아래 스크립트가 img-src를 조정한다). -->
<meta http-equiv="Content-Security-Policy" id="csp"
      content="default-src 'none';
               script-src file: 'unsafe-inline';
               style-src file: 'unsafe-inline';
               font-src file:;
               img-src data: https: http:">
<title>메일</title>
<link rel="stylesheet" href="../assets/font/pretendard.css">
<script src="icons.js"></script>
<style>
  :root {
    --accent: #4fc3a8;
    --scrim-a: 0.86;
    --scrim: rgba(26, 26, 30, var(--scrim-a));
    --label: rgba(255, 255, 255, 0.96);
    --secondary: rgba(235, 235, 245, 0.62);
    --tertiary: rgba(235, 235, 245, 0.34);
    --fill: rgba(255, 255, 255, 0.07);
    --fill-hi: rgba(255, 255, 255, 0.16);
    --hairline: rgba(255, 255, 255, 0.16);
    --separator: rgba(255, 255, 255, 0.10);
  }
  :root[data-theme="light"] {
    --accent: #23a58a;
    --scrim: rgba(250, 250, 252, var(--scrim-a));
    --label: rgba(0, 0, 0, 0.90);
    --secondary: rgba(60, 60, 67, 0.62);
    --tertiary: rgba(60, 60, 67, 0.40);
    --fill: rgba(0, 0, 0, 0.05);
    --fill-hi: rgba(0, 0, 0, 0.10);
    --hairline: rgba(0, 0, 0, 0.14);
    --separator: rgba(60, 60, 67, 0.13);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI Variable Display', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--label);
    padding: var(--inset, 12px);
  }
  /* 리사이즈 존의 기준 — 없으면 존이 창 밖에 놓여 잡히지 않는다 */
  .stage { position: relative; width: 100%; height: 100%; }
  .card {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    background: var(--scrim);
    border-radius: var(--r, 20px);
    overflow: hidden;
    box-shadow: inset 0 0 0 0.5px var(--hairline), 0 6px 20px rgba(0, 0, 0, 0.42);
  }
  /* 제목줄을 끌어 창을 옮긴다.
     app-region: drag는 OS가 마우스를 가져가 닫기 버튼 클릭이 안 잡히므로 직접 처리한다. */
  .head { flex: none; padding: 14px 16px 10px; display: flex; gap: 10px; align-items: flex-start; cursor: default; }
  .head .box { flex: 1; min-width: 0; }
  .subject { font-size: 14px; font-weight: 650; line-height: 1.35; word-break: break-word; }
  .meta { font-size: 11.5px; color: var(--tertiary); margin-top: 4px; }
  /* 읽음 상태 — 지금 상태를 보여주고, 누르면 바뀐다.
     열었다고 자동으로 읽음이 되지 않으므로 이 칩이 유일한 표시이자 조작이다. */
  .seen {
    all: unset; cursor: default; flex: none;
    font-family: inherit; font-size: 11px; font-weight: 600;
    padding: 4px 9px; border-radius: 999px; white-space: nowrap;
    background: var(--fill); color: var(--secondary);
    transition: background 0.15s, color 0.15s;
  }
  .seen.unread { background: color-mix(in srgb, #f5a623 22%, transparent); color: #f5a623; }
  .seen:hover { background: var(--fill-hi); }
  .seen.busy { opacity: 0.5; }
  .close {
    all: unset; cursor: default; flex: none;
    width: 24px; height: 24px; border-radius: 50%;
    display: grid; place-items: center; color: var(--secondary);
  }
  .close svg { width: 12px; height: 12px; }
  .close:hover { background: var(--fill); color: var(--label); }

  .body {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 10px 16px 16px;
    border-top: 0.5px solid var(--separator);
    font-size: 12.5px; line-height: 1.62; color: var(--secondary);
    white-space: pre-wrap; word-break: break-word;
    user-select: text;
  }
  /* 메일 원본 HTML을 그릴 때는 pre-wrap을 풀고 메일이 정한 서식을 살린다.
     배경은 흰색으로 둔다 — 메일은 흰 배경을 전제로 글자색을 정하므로
     어두운 카드 위에 그대로 얹으면 검은 글씨가 안 보인다. */
  .body.rich {
    white-space: normal;
    background: #fff; color: #1a1a1a;
    margin: 0; padding: 14px 16px;
  }
  .body.rich img { max-width: 100%; height: auto; }
  .body.rich table { max-width: 100%; border-collapse: collapse; }
  .body.rich td, .body.rich th { padding: 2px 6px; }
  .body.rich a { color: var(--accent); }
  .body.rich * { max-width: 100%; }
  .blocked {
    font-size: 11px; color: var(--tertiary);
    background: var(--fill); border-radius: 8px;
    padding: 6px 10px; margin: 0 16px 10px;
  }
  .body::-webkit-scrollbar { width: 8px; }
  .body::-webkit-scrollbar-thumb {
    background: transparent; border-radius: 4px; transition: background 0.15s;
  }
  .body:hover::-webkit-scrollbar-thumb { background: var(--fill-hi); }
  .note { color: var(--tertiary); font-size: 11.5px; }

  /* 첨부 — 메일에 들어 있는 그림만 보여준다 (원격 이미지는 받지 않는다) */
  /* 첨부가 많으면 본문이 밀려난다 — 제 몫만 쓰고 넘치면 그 안에서 스크롤 */
  .atts {
    flex: none; max-height: 38%; overflow-y: auto;
    border-top: 0.5px solid var(--separator); padding: 10px 16px 12px;
  }
  .atts .cap { font-size: 11px; color: var(--tertiary); margin-bottom: 8px; }
  .shots { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .shots img {
    max-width: 100%; max-height: 220px; border-radius: 8px; display: block;
    box-shadow: inset 0 0 0 0.5px var(--hairline); cursor: default;
  }
  .files { display: flex; flex-wrap: wrap; gap: 6px; }
  .file {
    all: unset; cursor: default;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; padding: 5px 9px; border-radius: 8px;
    background: var(--fill); color: var(--label);
  }
  .file:hover { background: var(--fill-hi); }
  .file .sz { color: var(--tertiary); font-variant-numeric: tabular-nums; }
  .saved { font-size: 11px; color: var(--accent); margin-top: 8px; }

  /* 가장자리 리사이즈 — 위젯과 같은 방식 (네이티브는 투명 창에서 폭주한다) */
  .rz { position: absolute; z-index: 9; }
  .rz-n { left: 12px; right: 12px; top: -4px; height: 10px; cursor: ns-resize; }
  .rz-s { left: 12px; right: 12px; bottom: -4px; height: 10px; cursor: ns-resize; }
  .rz-w { top: 12px; bottom: 12px; left: -4px; width: 10px; cursor: ew-resize; }
  .rz-e { top: 12px; bottom: 12px; right: -4px; width: 10px; cursor: ew-resize; }
  .rz-nw { left: -4px; top: -4px; width: 16px; height: 16px; cursor: nwse-resize; }
  .rz-ne { right: -4px; top: -4px; width: 16px; height: 16px; cursor: nesw-resize; }
  .rz-sw { left: -4px; bottom: -4px; width: 16px; height: 16px; cursor: nesw-resize; }
  .rz-se { right: -4px; bottom: -4px; width: 16px; height: 16px; cursor: nwse-resize; }
</style>
</head>
<body>
<div class="stage">
<div class="card">
  <div class="head">
    <div class="box">
      <div class="subject" id="subject">불러오는 중…</div>
      <div class="meta" id="meta"></div>
    </div>
    <button class="seen" id="seen" style="display:none"></button>
    <button class="close" id="close" title="닫기"></button>
  </div>
  <div class="body" id="body"></div>
  <div class="blocked" id="blocked" style="display:none"></div>
  <div class="atts" id="atts" style="display:none">
    <div class="cap" id="atts-cap"></div>
    <div class="shots" id="shots"></div>
    <div class="files" id="files"></div>
    <div class="saved" id="saved"></div>
  </div>
</div>
<div class="rz rz-n" data-dir="n"></div>
<div class="rz rz-s" data-dir="s"></div>
<div class="rz rz-w" data-dir="w"></div>
<div class="rz rz-e" data-dir="e"></div>
<div class="rz rz-nw" data-dir="nw"></div>
<div class="rz rz-ne" data-dir="ne"></div>
<div class="rz rz-sw" data-dir="sw"></div>
<div class="rz rz-se" data-dir="se"></div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  if (q.get('theme') === 'light') document.documentElement.dataset.theme = 'light';
  if (q.get('scrim')) document.documentElement.style.setProperty('--scrim-a', q.get('scrim'));
  if (q.get('inset')) document.documentElement.style.setProperty('--inset', q.get('inset') + 'px');
  if (q.get('radius')) document.documentElement.style.setProperty('--r', q.get('radius') + 'px');

  $('close').append(window.nunsIcon('close'));
  $('close').onclick = () => window.nunsseom.mailViewClose();
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') window.nunsseom.mailViewClose();
  });

  // 제목줄 드래그로 창 이동
  const head = document.querySelector('.head');
  let press = null;
  head.addEventListener('pointerdown', async (e) => {
    if (e.button !== 0 || e.target.closest('#close')) return;
    const b = await window.nunsseom.mailViewBounds();
    press = { sx: e.screenX, sy: e.screenY, x: b.x, y: b.y };
    try { head.setPointerCapture(e.pointerId); } catch {}
  });
  head.addEventListener('pointermove', (e) => {
    if (!press) return;
    window.nunsseom.mailViewMove({
      x: press.x + (e.screenX - press.sx),
      y: press.y + (e.screenY - press.sy)
    });
  });
  const endMove = (e) => {
    if (!press) return;
    press = null;
    try { head.releasePointerCapture(e.pointerId); } catch {}
  };
  head.addEventListener('pointerup', endMove);
  head.addEventListener('pointercancel', endMove);

  // 가장자리 드래그로 창 크기 조절 — 조절한 크기는 메인이 저장한다
  let rz = null;
  for (const zone of document.querySelectorAll('.rz')) {
    zone.addEventListener('pointerdown', async (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      try { zone.setPointerCapture(e.pointerId); } catch {}
      const b = await window.nunsseom.mailViewBounds();
      rz = { dir: zone.dataset.dir, sx: e.screenX, sy: e.screenY, ...b };
    });
    zone.addEventListener('pointermove', (e) => {
      if (!rz) return;
      const dx = e.screenX - rz.sx;
      const dy = e.screenY - rz.sy;
      let { x, y, width, height } = rz;
      if (rz.dir.includes('e')) width = rz.width + dx;
      if (rz.dir.includes('s')) height = rz.height + dy;
      if (rz.dir.includes('w')) { width = rz.width - dx; x = rz.x + dx; }
      if (rz.dir.includes('n')) { height = rz.height - dy; y = rz.y + dy; }
      window.nunsseom.mailViewSetBounds({ x, y, width, height, dir: rz.dir });
    });
    const end = (e) => {
      if (!rz) return;
      rz = null;
      try { zone.releasePointerCapture(e.pointerId); } catch {}
    };
    zone.addEventListener('pointerup', end);
    zone.addEventListener('pointercancel', end);
  }

  const fmt = (ms) => {
    const d = new Date(ms);
    return `${d.getMonth() + 1}월 ${d.getDate()}일 `
      + `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  };

  const kb = (n) => (n >= 1024 * 1024
    ? (n / 1024 / 1024).toFixed(1) + 'MB'
    : Math.max(1, Math.round(n / 1024)) + 'KB');

  function renderAttachments(list) {
    if (!list.length) return;
    $('atts').style.display = 'block';
    // 본문에 박힌 그림은 이미 본문에서 보이므로 여기서 또 크게 깔지 않는다
    const images = list.filter((a) => a.dataUrl && !a.inline);
    const inlineCount = list.filter((a) => a.inline).length;
    $('atts-cap').textContent = `첨부 ${list.length}개`
      + (inlineCount ? ` · 본문 그림 ${inlineCount}` : '')
      + (images.length ? ` · 그림 ${images.length}` : '');

    for (const a of images) {
      const img = document.createElement('img');
      img.src = a.dataUrl;          // 메일에 담겨 온 그림이라 네트워크를 타지 않는다
      img.alt = a.filename;
      img.title = `${a.filename} · ${kb(a.size)}`;
      $('shots').append(img);
    }
    // 그림도 저장할 수 있어야 하므로 파일 칩은 전부 만든다
    for (const a of list) {
      const b = document.createElement('button');
      b.className = 'file';
      const nm = document.createElement('span');
      nm.textContent = a.filename;
      const sz = document.createElement('span');
      sz.className = 'sz';
      sz.textContent = kb(a.size);
      b.append(nm, sz);
      b.onclick = async () => {
        const r = await window.nunsseom.mailSaveAttachment(a.index);
        if (r && r.ok) {
          $('saved').textContent = `저장했습니다 — ${r.path}`;
          $('saved').onclick = () => window.nunsseom.mailReveal(r.path);
        } else if (r && r.message) {
          $('saved').textContent = r.message;
        }
      };
      $('files').append(b);
    }
  }

  // ── 읽음 / 안 읽음 ────────────────────────────────
  // 이 창은 메일을 열었다고 읽음으로 바꾸지 않는다. 지금 상태를 보여주고,
  // 누르면 그때 바꾼다 — 한 통씩 손으로 정할 수 있게.
  function setupSeen(m) {
    const btn = $('seen');
    let seen = !!m.seen;
    let busy = false;

    const paint = () => {
      btn.style.display = '';
      btn.textContent = seen ? '읽음' : '안 읽음';
      btn.classList.toggle('unread', !seen);
      btn.classList.toggle('busy', busy);
      btn.title = seen ? '누르면 안 읽음으로 되돌립니다' : '누르면 읽음으로 표시합니다';
    };
    paint();

    btn.onclick = async () => {
      if (busy) return;
      const want = !seen;
      busy = true;
      seen = want;             // 서버를 기다리지 않고 먼저 바꿔 보여준다
      paint();
      const r = await window.nunsseom.mailMarkRead({
        accountId: m.accountId, uids: [m.uid], read: want
      });
      busy = false;
      if (!r || r.ok === false) {
        seen = !want;          // 서버가 거부했으면 되돌린다 — 바뀐 척하면 안 된다
        btn.title = (r && r.message) || '바꾸지 못했습니다';
      }
      paint();
    };
  }

  window.nunsseom.mailViewData().then((m) => {
    if (!m || m.error) {
      $('subject').textContent = '열 수 없습니다';
      $('body').textContent = (m && m.error) || '알 수 없는 오류';
      return;
    }
    $('subject').textContent = m.subject;
    $('meta').textContent = [m.from, fmt(m.at)].filter(Boolean).join(' · ');
    setupSeen(m);
    renderAttachments(m.attachments || []);
    if (m.blockedRemote) {
      $('blocked').style.display = 'block';
      $('blocked').textContent =
        `인터넷에서 받아오는 그림 ${m.blockedRemote}개는 표시하지 않았습니다`
        + ' (열어본 사실이 보낸 사람에게 전달될 수 있어요)';
    }
    if (m.html) {
      // 메인에서 위험한 태그를 걷어냈고, 이 창의 CSP가 외부 요청을 한 번 더 막는다
      $('body').classList.add('rich');
      $('body').innerHTML = m.html;
    } else if (m.text) {
      $('body').textContent = m.text;
    } else {
      const p = document.createElement('div');
      p.className = 'note';
      p.textContent = '글로 된 본문이 없습니다 (이미지나 첨부만 있는 메일일 수 있어요)';
      $('body').append(p);
    }
  });
</script>
</body>
</html>
