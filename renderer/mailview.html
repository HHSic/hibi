<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>메일</title>
<link rel="stylesheet" href="../assets/font/pretendard.css">
<script src="icons.js"></script>
<style>
  :root {
    --accent: #4fc3a8;
    --scrim-a: 0.86;
    --scrim: rgba(26, 26, 30, var(--scrim-a));
    --label: rgba(255, 255, 255, 0.96);
    --secondary: rgba(235, 235, 245, 0.62);
    --tertiary: rgba(235, 235, 245, 0.34);
    --fill: rgba(255, 255, 255, 0.07);
    --fill-hi: rgba(255, 255, 255, 0.16);
    --hairline: rgba(255, 255, 255, 0.16);
    --separator: rgba(255, 255, 255, 0.10);
  }
  :root[data-theme="light"] {
    --accent: #23a58a;
    --scrim: rgba(250, 250, 252, var(--scrim-a));
    --label: rgba(0, 0, 0, 0.90);
    --secondary: rgba(60, 60, 67, 0.62);
    --tertiary: rgba(60, 60, 67, 0.40);
    --fill: rgba(0, 0, 0, 0.05);
    --fill-hi: rgba(0, 0, 0, 0.10);
    --hairline: rgba(0, 0, 0, 0.14);
    --separator: rgba(60, 60, 67, 0.13);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI Variable Display', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--label);
    padding: var(--inset, 12px);
  }
  .card {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    background: var(--scrim);
    border-radius: var(--r, 20px);
    overflow: hidden;
    box-shadow: inset 0 0 0 0.5px var(--hairline), 0 6px 20px rgba(0, 0, 0, 0.42);
  }
  .head { flex: none; padding: 14px 16px 10px; display: flex; gap: 10px; align-items: flex-start; }
  .head .box { flex: 1; min-width: 0; }
  .subject { font-size: 14px; font-weight: 650; line-height: 1.35; word-break: break-word; }
  .meta { font-size: 11.5px; color: var(--tertiary); margin-top: 4px; }
  .close {
    all: unset; cursor: default; flex: none;
    width: 24px; height: 24px; border-radius: 50%;
    display: grid; place-items: center; color: var(--secondary);
  }
  .close svg { width: 12px; height: 12px; }
  .close:hover { background: var(--fill); color: var(--label); }

  .body {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 10px 16px 16px;
    border-top: 0.5px solid var(--separator);
    font-size: 12.5px; line-height: 1.62; color: var(--secondary);
    white-space: pre-wrap; word-break: break-word;
    user-select: text;
  }
  .body::-webkit-scrollbar { width: 8px; }
  .body::-webkit-scrollbar-thumb {
    background: transparent; border-radius: 4px; transition: background 0.15s;
  }
  .body:hover::-webkit-scrollbar-thumb { background: var(--fill-hi); }
  .note { color: var(--tertiary); font-size: 11.5px; }

  /* 첨부 — 메일에 들어 있는 그림만 보여준다 (원격 이미지는 받지 않는다) */
  .atts { flex: none; border-top: 0.5px solid var(--separator); padding: 10px 16px 12px; }
  .atts .cap { font-size: 11px; color: var(--tertiary); margin-bottom: 8px; }
  .shots { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .shots img {
    max-width: 100%; max-height: 220px; border-radius: 8px; display: block;
    box-shadow: inset 0 0 0 0.5px var(--hairline); cursor: default;
  }
  .files { display: flex; flex-wrap: wrap; gap: 6px; }
  .file {
    all: unset; cursor: default;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; padding: 5px 9px; border-radius: 8px;
    background: var(--fill); color: var(--label);
  }
  .file:hover { background: var(--fill-hi); }
  .file .sz { color: var(--tertiary); font-variant-numeric: tabular-nums; }
  .saved { font-size: 11px; color: var(--accent); margin-top: 8px; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="box">
      <div class="subject" id="subject">불러오는 중…</div>
      <div class="meta" id="meta"></div>
    </div>
    <button class="close" id="close" title="닫기"></button>
  </div>
  <div class="body" id="body"></div>
  <div class="atts" id="atts" style="display:none">
    <div class="cap" id="atts-cap"></div>
    <div class="shots" id="shots"></div>
    <div class="files" id="files"></div>
    <div class="saved" id="saved"></div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  if (q.get('theme') === 'light') document.documentElement.dataset.theme = 'light';
  if (q.get('scrim')) document.documentElement.style.setProperty('--scrim-a', q.get('scrim'));
  if (q.get('inset')) document.documentElement.style.setProperty('--inset', q.get('inset') + 'px');
  if (q.get('radius')) document.documentElement.style.setProperty('--r', q.get('radius') + 'px');

  $('close').append(window.nunsIcon('close'));
  $('close').onclick = () => window.nunsseom.mailViewClose();
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') window.nunsseom.mailViewClose();
  });

  const fmt = (ms) => {
    const d = new Date(ms);
    return `${d.getMonth() + 1}월 ${d.getDate()}일 `
      + `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  };

  const kb = (n) => (n >= 1024 * 1024
    ? (n / 1024 / 1024).toFixed(1) + 'MB'
    : Math.max(1, Math.round(n / 1024)) + 'KB');

  function renderAttachments(list) {
    if (!list.length) return;
    $('atts').style.display = 'block';
    const images = list.filter((a) => a.dataUrl);
    const files = list.filter((a) => !a.dataUrl);
    $('atts-cap').textContent = `첨부 ${list.length}개`
      + (images.length ? ` · 그림 ${images.length}` : '');

    for (const a of images) {
      const img = document.createElement('img');
      img.src = a.dataUrl;          // 메일에 담겨 온 그림이라 네트워크를 타지 않는다
      img.alt = a.filename;
      img.title = `${a.filename} · ${kb(a.size)}`;
      $('shots').append(img);
    }
    // 그림도 저장할 수 있어야 하므로 파일 칩은 전부 만든다
    for (const a of list) {
      const b = document.createElement('button');
      b.className = 'file';
      const nm = document.createElement('span');
      nm.textContent = a.filename;
      const sz = document.createElement('span');
      sz.className = 'sz';
      sz.textContent = kb(a.size);
      b.append(nm, sz);
      b.onclick = async () => {
        const r = await window.nunsseom.mailSaveAttachment(a.index);
        if (r && r.ok) {
          $('saved').textContent = `저장했습니다 — ${r.path}`;
          $('saved').onclick = () => window.nunsseom.mailReveal(r.path);
        } else if (r && r.message) {
          $('saved').textContent = r.message;
        }
      };
      $('files').append(b);
    }
  }

  window.nunsseom.mailViewData().then((m) => {
    if (!m || m.error) {
      $('subject').textContent = '열 수 없습니다';
      $('body').textContent = (m && m.error) || '알 수 없는 오류';
      return;
    }
    $('subject').textContent = m.subject;
    $('meta').textContent = [m.from, fmt(m.at)].filter(Boolean).join(' · ');
    renderAttachments(m.attachments || []);
    if (m.text) {
      $('body').textContent = m.text;
    } else {
      const p = document.createElement('div');
      p.className = 'note';
      p.textContent = '글로 된 본문이 없습니다 (이미지나 첨부만 있는 메일일 수 있어요)';
      $('body').append(p);
    }
  });
</script>
</body>
</html>
